<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>ComBank Premium Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

html,body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Inter,
        Segoe UI,
        sans-serif;

    background:#0f172a;
}

#map{

    width:100%;
    height:100%;
}

/* =========================
   MODERN MAP
========================= */

.leaflet-container{

    background:
        linear-gradient(
            180deg,
            #0f172a 0%,
            #111827 100%
        );
}

/* REMOVE ATTRIBUTION */

.leaflet-control-attribution{

    display:none !important;
}

/* =========================
   ZOOM CONTROLS
========================= */

.leaflet-control-zoom{

    border:none !important;

    border-radius:16px !important;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);

    margin-top:20px !important;
    margin-left:20px !important;
}

.leaflet-control-zoom a{

    background:
        rgba(255,255,255,.92) !important;

    color:#111827 !important;

    border:none !important;

    width:38px !important;
    height:38px !important;
    line-height:38px !important;

    font-size:22px !important;

    transition:.2s;
}

.leaflet-control-zoom a:hover{

    background:#2563eb !important;
    color:white !important;
}

/* =========================
   CLEAN MODERN MARKERS
========================= */

.marker{

    width:10px;
    height:10px;

    border-radius:50%;

    border:2px solid white;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.15);

}

/* HEALTHY */

.marker-ok{

    background:#10b981;
}

/* ALERT */

.marker-alert{

    background:#ef4444;
}

/* =========================
   POPUP CARD
========================= */

.leaflet-popup-content-wrapper{

    background:
        rgba(255,255,255,.96) !important;

    border-radius:20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.22);

    border:none;

    padding:0;
}

.leaflet-popup-tip{

    background:
        rgba(255,255,255,.96) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:260px !important;
}

.popup-card{

    padding:20px;
}

/* HEADER */

.popup-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.popup-title{

    font-size:18px;
    font-weight:700;

    color:#0f172a;
}

/* STATUS */

.popup-status{

    font-size:11px;
    font-weight:700;

    padding:6px 10px;

    border-radius:999px;
}

.status-ok{

    background:#dcfce7;
    color:#166534;
}

.status-alert{

    background:#fee2e2;
    color:#991b1b;
}

/* STATS */

.popup-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.popup-box{

    background:#f8fafc;

    border-radius:14px;

    padding:14px;
}

.popup-label{

    font-size:11px;

    color:#64748b;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:8px;
}

.popup-value{

    font-size:16px;
    font-weight:700;

    color:#0f172a;
}

/* CLOSE BUTTON */

.leaflet-container a.leaflet-popup-close-button{

    color:#475569 !important;

    top:10px !important;
    right:12px !important;

    font-size:18px !important;
}

/* =========================
   MAP GLASS OVERLAY
========================= */

.map-overlay{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at top left,
            rgba(37,99,235,.12),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(16,185,129,.10),
            transparent 35%
        );

    z-index:400;
}

</style>

</head>

<body>

<div id="map"></div>

<div class="map-overlay"></div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   INIT MAP
========================= */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        zoomControl:true,
        attributionControl:false,

        preferCanvas:true
    });

    /* LIGHT MODERN MAP */

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',

        {
            maxZoom:19
        }

    ).addTo(map);

    /* LABEL LAYER */

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',

        {
            pane:'shadowPane'
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY FORMAT
========================= */

function money(v){

    return new Intl.NumberFormat(

        'en-LK',

        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }

    ).format(v);
}

/* =========================
   GET TABLEAU DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(

        undefined,
        { ignoreSelection:true }

    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   RENDER
========================= */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    /* FIELD DETECTION */

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    /* PROCESS */

    const processed = data.map(d => {

        return {

            branch:
                branchField && d[branchField]
                    ? d[branchField].formattedValue
                    : "Unknown",

            lat:
                latField && d[latField]
                    ? Number(d[latField].nativeValue)
                    : NaN,

            lng:
                lngField && d[lngField]
                    ? Number(d[lngField].nativeValue)
                    : NaN,

            balance:
                balanceField && d[balanceField]
                    ? Number(d[balanceField].nativeValue)
                    : 0,

            limit:
                limitField && d[limitField]
                    ? Number(d[limitField].nativeValue)
                    : 0
        };
    });

    /* VALID COORDS */

    const valid = processed.filter(d => {

        return (

            !isNaN(d.lat) &&
            !isNaN(d.lng) &&

            d.lat >= 5 &&
            d.lat <= 11 &&

            d.lng >= 79 &&
            d.lng <= 82
        );
    });

    const bounds = [];

    /* MARKERS */

    valid.forEach(d => {

        const over =
            d.balance > d.limit;

        const markerClass =
            over ? 'marker-alert' : 'marker-ok';

        const statusClass =
            over ? 'status-alert' : 'status-ok';

        const statusText =
            over ? 'Over Limit' : 'Healthy';

        const icon = L.divIcon({

            className:'',

            html:`
                <div class="marker ${markerClass}">
                </div>
            `,

            iconSize:[10,10],
            iconAnchor:[5,5]
        });

        const marker = L.marker(

            [d.lat,d.lng],

            { icon }

        ).addTo(layer);

        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-header">

                    <div class="popup-title">
                        ${d.branch}
                    </div>

                    <div class="popup-status ${statusClass}">
                        ${statusText}
                    </div>

                </div>

                <div class="popup-grid">

                    <div class="popup-box">

                        <div class="popup-label">
                            Balance
                        </div>

                        <div class="popup-value">
                            ${money(d.balance)}
                        </div>

                    </div>

                    <div class="popup-box">

                        <div class="popup-label">
                            Limit
                        </div>

                        <div class="popup-value">
                            ${money(d.limit)}
                        </div>

                    </div>

                </div>

            </div>

        `);

        bounds.push([d.lat,d.lng]);
    });

    /* AUTO FIT */

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[40,40]

        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =========================
   INIT
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType.SummaryDataChanged,

            update

        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
