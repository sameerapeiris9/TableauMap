<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ComBank Smart Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070b17;
    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

#map{
    width:100%;
    height:100%;
    background:#070b17;
}

.leaflet-container{
    background:#070b17;
}

/* REMOVE ATTRIBUTION */

.leaflet-control-attribution{
    display:none !important;
}

/* MODERN ZOOM CONTROL */

.leaflet-control-zoom{

    border:none !important;

    box-shadow:
        0 10px 25px rgba(0,0,0,.35) !important;

    border-radius:14px !important;

    overflow:hidden;

    margin-top:20px !important;
    margin-left:20px !important;
}

.leaflet-control-zoom a{

    background:
        rgba(10,16,30,.92) !important;

    color:white !important;

    border:none !important;

    width:34px !important;
    height:34px !important;
    line-height:34px !important;

    font-size:20px !important;

    transition:.2s;
}

.leaflet-control-zoom a:hover{

    background:#16233f !important;
}

/* =========================
   MARKERS
========================= */

.marker-wrap{

    width:12px;
    height:12px;

    position:relative;
}

/* GLOW */

.marker-glow{

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    filter:blur(7px);

    opacity:.55;
}

/* CORE */

.marker-core{

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    border:1.5px solid rgba(255,255,255,.92);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:7px;
    font-weight:700;

    box-shadow:
        0 0 10px rgba(255,255,255,.18);
}

/* SAFE */

.ok .marker-core{
    background:#12d18e;
}

.ok .marker-glow{
    background:#12d18e;
}

/* ALERT */

.alert .marker-core{
    background:#ff4f6d;
}

.alert .marker-glow{
    background:#ff4f6d;
}

/* =========================
   POPUP CARD
========================= */

.leaflet-popup-content-wrapper{

    background:
        rgba(9,14,28,.96) !important;

    color:white;

    border-radius:20px;

    border:
        1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(16px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    padding:0;
}

.leaflet-popup-tip{

    background:
        rgba(9,14,28,.96) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:260px !important;
}

.popup-card{

    padding:20px;
}

/* HEADER */

.popup-header{

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.popup-title{

    font-size:18px;
    font-weight:700;

    color:white;

    letter-spacing:.3px;
}

.popup-badge{

    padding:5px 10px;

    border-radius:999px;

    font-size:11px;
    font-weight:700;
}

/* SAFE */

.badge-ok{

    background:
        rgba(18,209,142,.18);

    color:#12d18e;
}

/* ALERT */

.badge-alert{

    background:
        rgba(255,79,109,.18);

    color:#ff4f6d;
}

/* STATS */

.popup-stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.stat-box{

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.05);

    border-radius:14px;

    padding:14px;
}

.stat-label{

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1px;

    opacity:.6;

    margin-bottom:8px;
}

.stat-value{

    font-size:16px;
    font-weight:700;
}

/* REMOVE DEFAULT CLOSE BUTTON BG */

.leaflet-container a.leaflet-popup-close-button{

    color:white !important;

    top:10px !important;
    right:12px !important;

    font-size:18px !important;
}

/* SMOOTH */

.leaflet-popup{

    transition:opacity .15s linear;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   INIT MAP
========================= */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        zoomControl:true,
        attributionControl:false,

        preferCanvas:true

    });

    /* MODERN DARK TILE */

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',

        {
            maxZoom:19
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY
========================= */

function money(v){

    return new Intl.NumberFormat(

        'en-LK',

        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }

    ).format(v);
}

/* =========================
   GET DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(

        undefined,
        { ignoreSelection:true }

    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   RENDER
========================= */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    /* FIELD DETECTION */

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    /* PROCESS */

    const processed = data.map(d => {

        return {

            branch:
                branchField && d[branchField]
                    ? d[branchField].formattedValue
                    : "Unknown",

            lat:
                latField && d[latField]
                    ? Number(d[latField].nativeValue)
                    : NaN,

            lng:
                lngField && d[lngField]
                    ? Number(d[lngField].nativeValue)
                    : NaN,

            balance:
                balanceField && d[balanceField]
                    ? Number(d[balanceField].nativeValue)
                    : 0,

            limit:
                limitField && d[limitField]
                    ? Number(d[limitField].nativeValue)
                    : 0
        };
    });

    /* VALIDATE */

    const valid = processed.filter(d => {

        return (

            !isNaN(d.lat) &&
            !isNaN(d.lng) &&

            d.lat >= 5 &&
            d.lat <= 11 &&

            d.lng >= 79 &&
            d.lng <= 82
        );
    });

    const bounds = [];

    /* DRAW MARKERS */

    valid.forEach(d => {

        const over =
            d.balance > d.limit;

        const statusClass =
            over ? 'alert' : 'ok';

        const symbol =
            over ? '!' : '✓';

        const badgeClass =
            over ? 'badge-alert' : 'badge-ok';

        const badgeText =
            over ? 'Over Limit' : 'Healthy';

        const icon = L.divIcon({

            className:'',

            html:`

                <div class="marker-wrap ${statusClass}">

                    <div class="marker-glow"></div>

                    <div class="marker-core">
                        ${symbol}
                    </div>

                </div>

            `,

            iconSize:[12,12],
            iconAnchor:[6,6]
        });

        const marker = L.marker(

            [d.lat,d.lng],

            { icon }

        ).addTo(layer);

        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-header">

                    <div class="popup-title">
                        ${d.branch}
                    </div>

                    <div class="popup-badge ${badgeClass}">
                        ${badgeText}
                    </div>

                </div>

                <div class="popup-stats">

                    <div class="stat-box">

                        <div class="stat-label">
                            Balance
                        </div>

                        <div class="stat-value">
                            ${money(d.balance)}
                        </div>

                    </div>

                    <div class="stat-box">

                        <div class="stat-label">
                            Limit
                        </div>

                        <div class="stat-value">
                            ${money(d.limit)}
                        </div>

                    </div>

                </div>

            </div>

        `);

        bounds.push([d.lat,d.lng]);
    });

    /* AUTO FIT */

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[40,40]

        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =========================
   INIT
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType.SummaryDataChanged,

            update

        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
