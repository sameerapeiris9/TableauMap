<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ComBank Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111f;
    font-family:Arial;
}

#map{
    width:100%;
    height:100%;
}

.marker{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:14px;
    font-weight:bold;
    border:2px solid white;
    box-shadow:0 0 18px currentColor;
}

.summary{
    position:absolute;
    top:20px;
    left:20px;
    z-index:9999;
    background:rgba(0,0,0,.75);
    color:#00f2ff;
    padding:14px 20px;
    border-radius:14px;
    font-size:30px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="summary">
    <span id="count">0</span>
</div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   INIT MAP
========================= */

function initMap(){

    map = L.map('map',{
        center:[7.8731,80.7718],
        zoom:7,
        attributionControl:false
    });

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom:19
        }
    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY FORMAT
========================= */

function money(v){

    return new Intl.NumberFormat('en-LK',{
        style:'currency',
        currency:'LKR',
        maximumFractionDigits:0
    }).format(v);
}

/* =========================
   GET SUMMARY DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(
        undefined,
        { ignoreSelection:true }
    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   GET ENCODINGS
========================= */

async function getEncodingMap(ws){

    const spec = await ws.getVisualSpecificationAsync();

    const map = {};

    if(spec.activeMarksSpecificationIndex < 0)
        return map;

    const marks =
        spec.marksSpecifications[
            spec.activeMarksSpecificationIndex
        ];

    marks.encodings.forEach(e => {

        console.log("ENCODING:", e);

        map[e.id] = e.field;
    });

    return map;
}

/* =========================
   RENDER MAP
========================= */

function render(data, enc){

    layer.clearLayers();

    console.log("ENCODINGS:", enc);
    console.log("DATA:", data);

    const processed = data.map(d => {

        const limitKey = Object.keys(d).find(
            k => k.toLowerCase().includes('limit')
        );

        const latField =
            enc.latitude?.name ||
            enc.latitude?.fieldName;

        const lngField =
            enc.longitude?.name ||
            enc.longitude?.fieldName;

        const branchField =
            enc.branch?.name ||
            enc.branch?.fieldName;

        const balanceField =
            enc.balance?.name ||
            enc.balance?.fieldName;

        return {

            branch:
                branchField && d[branchField]
                    ? d[branchField].formattedValue
                    : "Unknown",

            lat:
                latField && d[latField]
                    ? Number(d[latField].nativeValue)
                    : NaN,

            lng:
                lngField && d[lngField]
                    ? Number(d[lngField].nativeValue)
                    : NaN,

            balance:
                balanceField && d[balanceField]
                    ? Number(d[balanceField].nativeValue)
                    : 0,

            limit:
                limitKey && d[limitKey]
                    ? Number(d[limitKey].nativeValue)
                    : 0
        };
    });

    console.log("PROCESSED:", processed);

    const valid = processed.filter(d =>
        !isNaN(d.lat) &&
        !isNaN(d.lng)
    );

    document.getElementById('count').innerText = valid.length;

    const bounds = [];

    valid.forEach(d => {

        const over = d.balance > d.limit;

        const color = over
            ? '#ff4560'
            : '#00e5a0';

        const symbol = over
            ? '!'
            : '✓';

        const icon = L.divIcon({
            className:'',
            html:`
                <div class="marker"
                     style="background:${color}">
                     ${symbol}
                </div>
            `,
            iconSize:[30,30],
            iconAnchor:[15,15]
        });

        const marker = L.marker(
            [d.lat,d.lng],
            { icon }
        ).addTo(layer);

        marker.bindPopup(`
            <b>${d.branch}</b>
            <br><br>
            Balance: ${money(d.balance)}
            <br>
            Limit: ${money(d.limit)}
        `);

        bounds.push([d.lat,d.lng]);
    });

    if(bounds.length){

        map.fitBounds(bounds,{
            padding:[30,30]
        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const [data, encodings] = await Promise.all([

        getSummaryDataTable(worksheet),
        getEncodingMap(worksheet)

    ]);

    render(data, encodings);
}

/* =========================
   INIT EXTENSION
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(
            tableau.TableauEventType.SummaryDataChanged,
            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
