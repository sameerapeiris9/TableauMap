<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComBank Modern Map</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060e1c; --surface: #0b1929; --accent: #00b4ff;
            --safe: #00e5a0; --warn: #ff4560; --gold: #ffd166;
            --text: #e8f4ff; --muted: #567799; --border: rgba(0,180,255,.15);
        }

        body, html { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono', monospace; overflow:hidden; }

        /* Modern Dark Map Overlay */
        #map { position:absolute; top:0; bottom:0; width:100%; z-index:1; background:var(--bg); }
        .leaflet-tile { filter: brightness(0.4) saturate(0.5) contrast(1.1) hue-rotate(200deg); }
        .leaflet-container { background: var(--bg) !important; }

        /* UI Overlay Components */
        .ui-element { position:absolute; z-index:1000; pointer-events:auto; backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:12px; background:rgba(11,25,41,0.85); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
        
        #summary { top:20px; left:20px; padding:12px 20px; }
        .sum-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
        .sum-val { font-family:'Syne', sans-serif; font-size:28px; font-weight:800; color:var(--accent); }

        /* Animated Marker */
        .marker-container { position:relative; width:40px; height:40px; }
        .marker-core { position:absolute; inset:10px; border-radius:50%; border:2px solid currentColor; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-weight:bold; }
        .marker-ring { position:absolute; inset:0; border-radius:50%; border:2px solid currentColor; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { transform:scale(0.5); opacity:1; } 100% { transform:scale(1.5); opacity:0; } }

        /* Branch Detail Panel */
        #panel {
            position:absolute; bottom:30px; left:50%; transform:translateX(-50%) translateY(30px);
            width:min(90vw, 400px); opacity:0; visibility:hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #panel.active { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
        .panel-content { padding:20px; }
        .p-title { font-family:'Syne', sans-serif; font-size:18px; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px; }
        .p-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px; }
        .stat-box { background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; }
        .stat-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; }
        .stat-val { font-size:14px; margin-top:4px; }

        .progress-bg { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
        .progress-fill { height:100%; transition: width 1s ease-out; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="summary" class="ui-element">
    <div class="sum-lbl">Active Branches</div>
    <div class="sum-val" id="count-display">0</div>
</div>

<div id="panel" class="ui-element">
    <div class="panel-content">
        <div class="p-title" id="p-name">Branch Details</div>
        <div class="p-grid">
            <div class="stat-box"><div class="stat-lbl">Actual Balance</div><div class="stat-val" id="p-bal">--</div></div>
            <div class="stat-box"><div class="stat-lbl">Limit</div><div class="stat-val" id="p-limit">--</div></div>
        </div>
        <div class="stat-lbl" style="margin-bottom:5px">Utilization</div>
        <div class="progress-bg"><div id="p-bar" class="progress-fill"></div></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
    let map, markersLayer;

    // Format Currency
    const fmt = (v) => new Intl.NumberFormat('en-LK', { style: 'currency', currency: 'LKR', maximumFractionDigits: 0 }).format(v);

    // Initialize Extension
    tableau.extensions.initializeAsync().then(() => {
        map = L.map('map', { center: [7.87, 80.77], zoom: 7, zoomControl: false, attributionControl: false });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        markersLayer = L.layerGroup().addTo(map);

        const update = async () => {
            const worksheet = tableau.extensions.worksheetContent.worksheet;
            const reader = await worksheet.getSummaryDataReaderAsync();
            const page = await reader.getPageAsync(0);
            
            const data = page.data.map(row => {
                const item = {};
                page.columns.forEach((col, i) => {
                    if (col.fieldName.toLowerCase().includes('lat')) item.lat = row[i].nativeValue;
                    if (col.fieldName.toLowerCase().includes('long')) item.lng = row[i].nativeValue;
                    if (col.fieldName.toLowerCase().includes('branch')) item.name = row[i].formattedValue;
                    if (col.fieldName.toLowerCase().includes('balance')) item.bal = row[i].nativeValue;
                    if (col.fieldName.toLowerCase().includes('limit')) item.limit = row[i].nativeValue;
                });
                return item;
            });

            render(data);
            await reader.releaseAsync();
        };

        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, update);
        update();
    });

    function render(data) {
        markersLayer.clearLayers();
        document.getElementById('count-display').innerText = data.length;

        data.forEach(d => {
            if (!d.lat || !d.lng) return;
            const isOver = d.bal > d.limit;
            const color = isOver ? '#ff4560' : '#00e5a0';

            const icon = L.divIcon({
                className: '',
                html: `<div class="marker-container" style="color:${color}">
                        <div class="marker-ring"></div>
                        <div class="marker-core">${isOver ? '!' : '✓'}</div>
                       </div>`,
                iconSize: [40, 40], iconAnchor: [20, 20]
            });

            const marker = L.marker([d.lat, d.lng], { icon }).addTo(markersLayer);
            marker.on('click', () => {
                map.flyTo([d.lat, d.lng], 12, { duration: 1.5 });
                showDetails(d);
            });
        });
    }

    function showDetails(d) {
        const panel = document.getElementById('panel');
        const bar = document.getElementById('p-bar');
        const ratio = Math.min((d.bal / d.limit) * 100, 100);

        document.getElementById('p-name').innerText = d.name;
        document.getElementById('p-bal').innerText = fmt(d.bal);
        document.getElementById('p-limit').innerText = fmt(d.limit);
        
        bar.style.width = ratio + '%';
        bar.style.background = d.bal > d.limit ? 'var(--warn)' : 'var(--safe)';
        
        panel.classList.add('active');
        setTimeout(() => { if(!panel.matches(':hover')) panel.classList.remove('active'); }, 5000);
    }
</script>
</body>
</html>
