<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ComBank Fast Branch Map</title>

<!-- TABLEAU -->
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<!-- LEAFLET -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

/* ======================================================
   GLOBAL
====================================================== */

html,
body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#07111f;

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

#map{

    width:100%;
    height:100%;
}

/* ======================================================
   PERFORMANCE OPTIMIZED MAP
====================================================== */

.leaflet-container{

    background:#07111f;
}

/* REMOVE ATTRIBUTION */

.leaflet-control-attribution{

    display:none !important;
}

/* ======================================================
   GLASS PANEL
====================================================== */

.glass{

    background:
        rgba(6,18,35,.78);

    border:
        1px solid rgba(255,255,255,.06);

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.28);
}

/* ======================================================
   LEFT STATUS PANEL
====================================================== */

.panel{

    position:absolute;

    top:14px;
    left:14px;

    width:170px;

    border-radius:16px;

    z-index:9999;

    padding:16px;
}

.panel-title{

    color:white;

    font-size:14px;
    font-weight:700;

    margin-bottom:14px;
}

.legend{

    display:flex;
    align-items:center;

    margin-bottom:10px;
}

.legend-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    margin-right:10px;
}

.dot-ok{

    background:#10d876;
}

.dot-alert{

    background:#ff4d67;
}

.legend-text{

    color:rgba(255,255,255,.82);

    font-size:12px;
}

.divider{

    height:1px;

    background:
        rgba(255,255,255,.08);

    margin:16px 0;
}

.summary{

    display:flex;
    justify-content:space-between;

    margin-bottom:10px;
}

.summary-label{

    color:rgba(255,255,255,.7);

    font-size:12px;
}

.summary-value{

    font-size:12px;
    font-weight:700;
}

.ok-value{

    color:#10d876;
}

.alert-value{

    color:#ff4d67;
}

/* ======================================================
   FAST LIGHTWEIGHT MARKERS
====================================================== */

.branch-marker{

    width:10px;
    height:10px;

    border-radius:50%;

    border:2px solid white;
}

.marker-ok{

    background:#10d876;
}

.marker-alert{

    background:#ff4d67;
}

/* ======================================================
   MODERN POPUP
====================================================== */

.leaflet-popup-content-wrapper{

    background:
        rgba(8,17,32,.94) !important;

    border-radius:16px;

    border:
        1px solid rgba(255,255,255,.06);

    box-shadow:
        0 14px 35px rgba(0,0,0,.32);

    padding:0;
}

.leaflet-popup-tip{

    background:
        rgba(8,17,32,.94) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:260px !important;
}

.popup{

    padding:16px;
}

.popup-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:16px;
}

.popup-title{

    color:white;

    font-size:17px;
    font-weight:700;
}

.popup-status{

    padding:5px 9px;

    border-radius:999px;

    font-size:10px;
    font-weight:700;
}

.status-ok{

    background:
        rgba(16,216,118,.18);

    color:#10d876;
}

.status-alert{

    background:
        rgba(255,77,103,.18);

    color:#ff4d67;
}

/* STATS */

.stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.stat{

    background:
        rgba(255,255,255,.04);

    border-radius:12px;

    padding:12px;
}

.stat-label{

    color:rgba(255,255,255,.6);

    font-size:10px;

    margin-bottom:6px;

    text-transform:uppercase;
}

.stat-value{

    color:white;

    font-size:15px;
    font-weight:700;
}

/* ======================================================
   ZOOM CONTROL
====================================================== */

.leaflet-control-zoom{

    border:none !important;

    border-radius:14px !important;

    overflow:hidden;

    margin-top:14px !important;
    margin-right:14px !important;

    box-shadow:
        0 8px 24px rgba(0,0,0,.24);
}

.leaflet-control-zoom a{

    background:
        rgba(255,255,255,.95) !important;

    color:#111827 !important;

    border:none !important;

    width:34px !important;
    height:34px !important;

    line-height:34px !important;

    font-size:20px !important;
}

.leaflet-control-zoom a:hover{

    background:#0ea5e9 !important;

    color:white !important;
}

/* ======================================================
   PERFORMANCE IMPROVEMENTS
====================================================== */

/* disable heavy transitions */

.leaflet-fade-anim .leaflet-popup{

    transition:none !important;
}

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon{

    will-change:auto !important;
}

</style>

</head>

<body>

<div id="map"></div>

<!-- ======================================================
     SIDE PANEL
====================================================== -->

<div class="panel glass">

    <div class="panel-title">
        Branch Status
    </div>

    <div class="legend">
        <div class="legend-dot dot-ok"></div>
        <div class="legend-text">
            Within Limit
        </div>
    </div>

    <div class="legend">
        <div class="legend-dot dot-alert"></div>
        <div class="legend-text">
            Over Limit
        </div>
    </div>

    <div class="divider"></div>

    <div class="summary">
        <div class="summary-label">
            Healthy
        </div>

        <div class="summary-value ok-value"
             id="okCount">
            0
        </div>
    </div>

    <div class="summary">
        <div class="summary-label">
            Risk
        </div>

        <div class="summary-value alert-value"
             id="alertCount">
            0
        </div>
    </div>

</div>

<script>

/* ======================================================
   VARIABLES
====================================================== */

let worksheet;
let map;
let layer;

/* ======================================================
   FAST MAP INIT
====================================================== */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        zoomControl:true,
        attributionControl:false,

        fadeAnimation:false,
        zoomAnimation:true,
        markerZoomAnimation:false,

        preferCanvas:true
    });

    /* FAST LIGHT MAP */

    L.tileLayer(

        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

        {
            maxZoom:18,
            updateWhenIdle:true,
            keepBuffer:2
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* ======================================================
   MONEY FORMAT
====================================================== */

function money(v){

    return new Intl.NumberFormat(

        'en-LK',

        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }

    ).format(v);
}

/* ======================================================
   GET TABLEAU DATA
====================================================== */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(

        undefined,
        { ignoreSelection:true }

    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* ======================================================
   RENDER MAP
====================================================== */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    /* FIELD DETECTION */

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    let okCount = 0;
    let alertCount = 0;

    const bounds = [];

    /* DRAW */

    for(let i=0; i<data.length; i++){

        const d = data[i];

        const branch =
            branchField && d[branchField]
                ? d[branchField].formattedValue
                : "Unknown";

        const lat =
            latField && d[latField]
                ? Number(d[latField].nativeValue)
                : NaN;

        const lng =
            lngField && d[lngField]
                ? Number(d[lngField].nativeValue)
                : NaN;

        const balance =
            balanceField && d[balanceField]
                ? Number(d[balanceField].nativeValue)
                : 0;

        const limit =
            limitField && d[limitField]
                ? Number(d[limitField].nativeValue)
                : 0;

        if(
            isNaN(lat) ||
            isNaN(lng)
        ){
            continue;
        }

        const over = balance > limit;

        if(over){
            alertCount++;
        }else{
            okCount++;
        }

        const markerClass =
            over
                ? 'marker-alert'
                : 'marker-ok';

        const statusClass =
            over
                ? 'status-alert'
                : 'status-ok';

        const statusText =
            over
                ? 'Over Limit'
                : 'Healthy';

        const icon = L.divIcon({

            className:'',

            html:`
                <div class="branch-marker ${markerClass}">
                </div>
            `,

            iconSize:[10,10],
            iconAnchor:[5,5]
        });

        const marker = L.marker(

            [lat,lng],

            { icon }

        );

        marker.bindPopup(`

            <div class="popup">

                <div class="popup-header">

                    <div class="popup-title">
                        ${branch}
                    </div>

                    <div class="popup-status ${statusClass}">
                        ${statusText}
                    </div>

                </div>

                <div class="stats">

                    <div class="stat">

                        <div class="stat-label">
                            Balance
                        </div>

                        <div class="stat-value">
                            ${money(balance)}
                        </div>

                    </div>

                    <div class="stat">

                        <div class="stat-label">
                            Limit
                        </div>

                        <div class="stat-value">
                            ${money(limit)}
                        </div>

                    </div>

                </div>

            </div>

        `);

        marker.addTo(layer);

        bounds.push([lat,lng]);
    }

    /* UPDATE COUNTS */

    document.getElementById('okCount').innerText =
        okCount;

    document.getElementById('alertCount').innerText =
        alertCount;

    /* FIT */

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[25,25]
        });
    }
}

/* ======================================================
   UPDATE
====================================================== */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* ======================================================
   INIT
====================================================== */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType.SummaryDataChanged,

            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
