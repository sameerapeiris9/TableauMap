<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComBank Branch Map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ─── RESET & TOKENS ──────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:       #060e1c;
  --surface:  #0b1929;
  --surface2: #0f2035;
  --border:   rgba(0,180,255,.13);
  --accent:   #00b4ff;
  --safe:     #00e5a0;
  --warn:     #ff4560;
  --gold:     #ffd166;
  --text:     #e8f4ff;
  --muted:    #567799;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}

/* ─── HEADER ──────────────────────────────────── */
#header{
  position:fixed;top:0;left:0;right:0;
  height:54px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  background:rgba(6,14,28,.92);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  z-index:1000;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{
  width:32px;height:32px;
  background:linear-gradient(135deg,#0055ff,#00b4ff);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em}
.logo-tag{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.live-dot{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;background:var(--safe);
  margin-right:5px;box-shadow:0 0 7px var(--safe);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── MAP (full screen minus header) ─────────── */
#map{
  position:fixed;top:54px;left:0;right:0;bottom:0;
  z-index:1;
}

/* Dark tile overlay */
.leaflet-tile{filter:brightness(.28) saturate(.35) hue-rotate(205deg)}
.leaflet-container{background:var(--bg)}

/* ─── LOADING OVERLAY ─────────────────────────── */
#loading{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:18px;z-index:9999;
  transition:opacity .5s;
}
.ld-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--accent);letter-spacing:.1em}
.ld-bar-bg{width:180px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.ld-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#0055ff,var(--accent));border-radius:2px;animation:ldbar 1.4s ease forwards}
@keyframes ldbar{to{width:100%}}
.ld-txt{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

/* ─── BRANCH INFO PANEL (inside map) ─────────── */
#panel{
  position:absolute;           /* relative to #map */
  bottom:30px;left:50%;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  width:min(94vw,420px);
  background:rgba(11,25,41,.96);
  border:1px solid var(--accent);
  border-radius:16px;
  overflow:hidden;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 48px rgba(0,180,255,.18);
  transition:opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
  z-index:600;
  pointer-events:none;
}
#panel.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

.panel-top{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px 12px;
  border-bottom:1px solid var(--border);
}
.panel-icon{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.panel-icon.safe{background:rgba(0,229,160,.12);box-shadow:0 0 14px rgba(0,229,160,.25)}
.panel-icon.warn{background:rgba(255,69,96,.12);box-shadow:0 0 14px rgba(255,69,96,.25)}
.panel-name{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;line-height:1.25}
.panel-code{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:3px}

.panel-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)}
.pstat{background:var(--surface2);padding:12px 14px}
.pstat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.pstat-val{font-size:14px;font-weight:500}
.pstat-val.blue{color:var(--accent)}
.pstat-val.gold{color:var(--gold)}
.pstat-val.safe{color:var(--safe)}
.pstat-val.warn{color:var(--warn)}

.panel-footer{padding:12px 16px}
.util-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.bar-bg{height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.bar-fill.safe{background:linear-gradient(90deg,var(--safe),#00ffcc);box-shadow:0 0 8px var(--safe)}
.bar-fill.warn{background:linear-gradient(90deg,var(--warn),#ff8a00);box-shadow:0 0 8px var(--warn)}

#close-btn{
  position:absolute;top:10px;right:12px;
  background:none;border:none;color:var(--muted);
  font-size:20px;cursor:pointer;line-height:1;
  transition:color .2s;
}
#close-btn:hover{color:var(--text)}

/* ─── SUMMARY BADGE (top-left) ────────────────── */
#summary{
  position:absolute;top:14px;left:14px;
  z-index:500;
  background:rgba(11,25,41,.9);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 16px;
  backdrop-filter:blur(10px);
  min-width:130px;
}
.sum-lbl{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.sum-val{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--accent);line-height:1}
.sum-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ─── LEGEND (top-right) ─────────────────────── */
#legend{
  position:absolute;top:14px;right:14px;
  z-index:500;
  background:rgba(11,25,41,.9);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:7px;
}
.leg-item{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ─── ZOOM CONTROL ───────────────────────────── */
.leaflet-control-zoom{
  border:1px solid var(--border) !important;
  border-radius:8px !important;
  overflow:hidden;
}
.leaflet-control-zoom-in,
.leaflet-control-zoom-out{
  background:rgba(11,25,41,.9) !important;
  color:var(--accent) !important;
  border-bottom:1px solid var(--border) !important;
}
.leaflet-control-zoom-in:hover,
.leaflet-control-zoom-out:hover{background:var(--surface2) !important}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="ld-title">COMBANK</div>
  <div class="ld-bar-bg"><div class="ld-bar-fill"></div></div>
  <div class="ld-txt">Loading branch data…</div>
</div>

<!-- HEADER -->


<!-- MAP -->
<div id="map">

  <!-- Summary badge -->
  <div id="summary">
    <div class="sum-lbl">Branches</div>
    <div class="sum-val" id="sum-count">—</div>
    <div class="sum-sub" id="sum-status">Loading…</div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <div class="leg-item">
      <div class="leg-dot" style="background:var(--safe);box-shadow:0 0 6px var(--safe)"></div>
      Within Limit
    </div>
    <div class="leg-item">
      <div class="leg-dot" style="background:var(--warn);box-shadow:0 0 6px var(--warn)"></div>
      Limit Exceeded
    </div>
  </div>

  <!-- Branch detail panel -->
  <div id="panel">
    <button id="close-btn" title="Close">×</button>
    <div class="panel-top">
      <div class="panel-icon" id="p-icon">🏦</div>
      <div>
        <div class="panel-name" id="p-name">—</div>
        <div class="panel-code" id="p-code">—</div>
      </div>
    </div>
    <div class="panel-body">
      <div class="pstat">
        <div class="pstat-lbl">Balance</div>
        <div class="pstat-val blue" id="p-balance">—</div>
      </div>
      <div class="pstat">
        <div class="pstat-lbl">Limit</div>
        <div class="pstat-val gold" id="p-limit">—</div>
      </div>
      <div class="pstat">
        <div class="pstat-lbl">Status</div>
        <div class="pstat-val" id="p-status">—</div>
      </div>
    </div>
    <div class="panel-footer">
      <div class="util-row">
        <span>Utilization</span>
        <span id="p-util-pct">—</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="p-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── Helpers ────────────────────────────────────────────────
function fmtLKR(n) {
  if (n >= 1e6) return 'LKR ' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return 'LKR ' + (n / 1e3).toFixed(1) + 'K';
  return 'LKR ' + Number(n).toLocaleString();
}

function exceeded(row) { return row.Balance > row.Limit; }

function makeIcon(row) {
  const over  = exceeded(row);
  const color = over ? '#ff4560' : '#00e5a0';
  const glow  = over ? 'rgba(255,69,96,.6)' : 'rgba(0,229,160,.55)';
  const sym   = over ? '!' : '✦';
  const html  = `
    <div style="width:48px;height:48px;position:relative;">
      <div style="
        position:absolute;inset:0;border-radius:50%;
        border:2px solid ${color};
        animation:ring 2.6s ease-in-out infinite;
      "></div>
      <div style="
        position:absolute;inset:9px;border-radius:50%;
        background:${over ? 'rgba(255,69,96,.18)' : 'rgba(0,229,160,.14)'};
        border:2px solid ${color};
        display:flex;align-items:center;justify-content:center;
        color:${color};font-weight:700;font-size:14px;
        box-shadow:0 0 18px ${glow};
      ">${sym}</div>
    </div>`;
  return L.divIcon({ html, className:'', iconSize:[48,48], iconAnchor:[24,24] });
}

// ── Map init ───────────────────────────────────────────────
const map = L.map('map', {
  center: [7.87, 80.77],
  zoom: 7,
  attributionControl: false,
  zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// ── Panel logic ────────────────────────────────────────────
const panel    = document.getElementById('panel');
const closeBtn = document.getElementById('close-btn');

function showPanel(row) {
  const over   = exceeded(row);
  const cls    = over ? 'warn' : 'safe';
  const util   = (row.Balance / row.Limit) * 100;
  const capPct = Math.min(util, 100);

  document.getElementById('p-icon').className   = 'panel-icon ' + cls;
  document.getElementById('p-icon').textContent = over ? '⚠️' : '🏦';
  document.getElementById('p-name').textContent  = row.Branch;
  document.getElementById('p-code').textContent  = 'Branch Code: ' + row.Code + '  ·  ' + row.Address;
  document.getElementById('p-balance').textContent = fmtLKR(row.Balance);
  document.getElementById('p-limit').textContent   = fmtLKR(row.Limit);

  const statusEl = document.getElementById('p-status');
  statusEl.textContent = over ? '⚠ EXCEEDED' : '✓ OK';
  statusEl.className   = 'pstat-val ' + cls;

  document.getElementById('p-util-pct').textContent = util.toFixed(1) + '%';
  document.getElementById('p-util-pct').style.color = over ? 'var(--warn)' : 'var(--safe)';

  const bar = document.getElementById('p-bar');
  bar.className = 'bar-fill ' + cls;
  // Animate: reset then set
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = capPct + '%'; }));

  panel.classList.add('visible');
}

closeBtn.addEventListener('click', () => panel.classList.remove('visible'));

// ── Load data via google.script.run ───────────────────────
function hideLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 500);
}

function renderBranches(data) {
  if (!data || data.length === 0) {
    document.getElementById('sum-count').textContent  = '0';
    document.getElementById('sum-status').textContent = 'No data';
    hideLoading();
    return;
  }

  const exceeded_count = data.filter(d => exceeded(d)).length;
  document.getElementById('sum-count').textContent  = data.length;
  document.getElementById('sum-status').textContent =
    exceeded_count + ' branch' + (exceeded_count !== 1 ? 'es' : '') + ' over limit';

  const bounds = [];

  data.forEach(row => {
    if (!row.Latitude || !row.Longitude) return;
    const latlng = [row.Latitude, row.Longitude];
    bounds.push(latlng);

    const marker = L.marker(latlng, { icon: makeIcon(row) }).addTo(map);

    marker.on('click', () => {
      map.setView(latlng, Math.max(map.getZoom(), 13), { animate: true, duration: 0.7 });
      showPanel(row);
    });
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [70, 70] });

  hideLoading();
}

function onError(err) {
  document.getElementById('loading').innerHTML =
    `<div style="color:var(--warn);font-family:'Syne',sans-serif;text-align:center;padding:20px">
      ⚠ Failed to load data<br>
      <span style="font-size:11px;color:var(--muted)">${err ? err.message || err : 'Unknown error'}</span>
    </div>`;
}

// Call the server-side function
google.script.run
  .withSuccessHandler(renderBranches)
  .withFailureHandler(onError)
  .getBranchData();
</script>

<!-- Keyframe for marker ring (injected into head via style is not possible in GAS, so inline) -->
<style>
@keyframes ring{
  0%  {transform:scale(1);  opacity:.8}
  60% {transform:scale(1.5);opacity:0}
  100%{transform:scale(1);  opacity:0}
}
</style>
</body>
</html>
