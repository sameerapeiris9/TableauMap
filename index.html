<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ComBank Branch Intelligence</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,
body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#020617;

    font-family:
        Inter,
        Segoe UI,
        sans-serif;
}

#map{

    width:100%;
    height:100%;
}

/* PURE BLACK MAP */

.leaflet-container{

    background:#020617;
}

/* REMOVE ATTRIBUTION */

.leaflet-control-attribution{

    display:none !important;
}

/* PERFORMANCE */

.leaflet-pane,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile{

    will-change:auto !important;
}

/* PANEL */

.dashboard-panel{

    position:absolute;

    top:18px;
    left:18px;

    width:240px;

    z-index:9999;

    background:
        rgba(15,23,42,.92);

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:20px;

    overflow:hidden;

    backdrop-filter:blur(10px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.45);
}

.panel-header{

    padding:20px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.panel-title{

    color:white;

    font-size:18px;
    font-weight:700;
}

.panel-sub{

    color:
        rgba(255,255,255,.5);

    font-size:12px;

    margin-top:4px;
}

.panel-body{

    padding:20px;
}

.stat{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:16px;
}

.stat-left{

    display:flex;
    align-items:center;
}

.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    margin-right:10px;
}

.green{

    background:#10b981;
}

.red{

    background:#ef4444;
}

.stat-label{

    color:rgba(255,255,255,.8);

    font-size:13px;
}

.stat-value{

    color:white;

    font-size:14px;
    font-weight:700;
}

/* MARKERS */

.branch-marker{

    width:9px;
    height:9px;

    border-radius:50%;

    border:1.5px solid white;
}

.marker-ok{

    background:#10b981;
}

.marker-risk{

    background:#ef4444;
}

/* POPUP */

.leaflet-popup-content-wrapper{

    background:
        rgba(15,23,42,.98) !important;

    border-radius:20px;

    border:
        1px solid rgba(255,255,255,.05);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.leaflet-popup-tip{

    background:
        rgba(15,23,42,.98) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:320px !important;
}

.popup{

    padding:22px;
}

.branch{

    color:white;

    font-size:22px;
    font-weight:700;

    margin-bottom:14px;
}

.status{

    display:inline-flex;

    padding:6px 12px;

    border-radius:999px;

    font-size:11px;
    font-weight:700;

    margin-bottom:18px;
}

.status-ok{

    background:
        rgba(16,185,129,.12);

    color:#10b981;
}

.status-risk{

    background:
        rgba(239,68,68,.12);

    color:#ef4444;
}

.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    margin-bottom:18px;
}

.card{

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.05);

    border-radius:16px;

    padding:14px;
}

.card-label{

    color:
        rgba(255,255,255,.5);

    font-size:11px;

    margin-bottom:8px;
}

.card-value{

    color:white;

    font-size:18px;
    font-weight:700;
}

.bar{

    width:100%;
    height:8px;

    border-radius:999px;

    overflow:hidden;

    background:
        rgba(255,255,255,.06);
}

.fill{

    height:100%;
}

.fill-ok{

    background:
        linear-gradient(
            90deg,
            #10b981,
            #06b6d4
        );
}

.fill-risk{

    background:
        linear-gradient(
            90deg,
            #ef4444,
            #f97316
        );
}

</style>

</head>

<body>

<div id="map"></div>

<div class="dashboard-panel">

    <div class="panel-header">

        <div class="panel-title">
            Branch Intelligence
        </div>

        <div class="panel-sub">
            Real-time monitoring
        </div>

    </div>

    <div class="panel-body">

        <div class="stat">

            <div class="stat-left">

                <div class="dot green"></div>

                <div class="stat-label">
                    Healthy
                </div>

            </div>

            <div class="stat-value"
                 id="healthyCount">
                0
            </div>

        </div>

        <div class="stat">

            <div class="stat-left">

                <div class="dot red"></div>

                <div class="stat-label">
                    Risk
                </div>

            </div>

            <div class="stat-value"
                 id="riskCount">
                0
            </div>

        </div>

        <div class="stat">

            <div class="stat-label">
                Total
            </div>

            <div class="stat-value"
                 id="totalCount">
                0
            </div>

        </div>

    </div>

</div>

<script>

let worksheet;
let map;
let layer;

/* MAP */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        preferCanvas:true,

        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false,

        attributionControl:false
    });

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',

        {
            maxZoom:18,
            updateWhenIdle:true,
            keepBuffer:2
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* PARAMETER */

async function updateParameter(branchCode){

    try{

        const dashboard =
            tableau.extensions.dashboardContent.dashboard;

        const parameters =
            await dashboard.getParametersAsync();

        const parameter =
            parameters.find(p =>
                p.name === "Selected Branch code"
            );

        if(parameter){

            await parameter.changeValueAsync(
                String(branchCode)
            );

            console.log(
                "Updated Parameter:",
                branchCode
            );
        }

    }catch(error){

        console.error(
            "Parameter Error:",
            error
        );
    }
}

/* DATA */

async function getData(){

    let rows = [];

    const reader =
        await worksheet.getSummaryDataReaderAsync();

    for(let i=0; i<reader.pageCount; i++){

        const page =
            await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((c,idx)=>{

                    row[c.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* RENDER */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const keys =
        Object.keys(data[0]);

    const branchField =
        keys.find(k =>
            k.toLowerCase() === 'branch'
        );

    const branchCodeField =
        keys.find(k =>
            k.toLowerCase().includes('branch code')
        );

    const latField =
        keys.find(k =>
            k.toLowerCase() === 'latitude'
        );

    const lngField =
        keys.find(k =>
            k.toLowerCase() === 'longitude'
        );

    const balanceField =
        keys.find(k =>
            k.toLowerCase().includes('balance')
        );

    const limitField =
        keys.find(k =>
            k.toLowerCase().includes('limit')
        );

    let healthy = 0;
    let risk = 0;

    const bounds = [];

    data.forEach(d => {

        const lat =
            Number(d[latField]?.nativeValue);

        const lng =
            Number(d[lngField]?.nativeValue);

        if(isNaN(lat) || isNaN(lng)){
            return;
        }

        const branch =
            d[branchField]?.formattedValue || '';

        const branchCode =
            d[branchCodeField]?.formattedValue || '';

        const balance =
            Number(
                d[balanceField]?.nativeValue || 0
            );

        const limit =
            Number(
                d[limitField]?.nativeValue || 0
            );

        const over =
            balance > limit;

        if(over){
            risk++;
        }else{
            healthy++;
        }

        const util =
            limit > 0
            ? ((balance / limit) * 100).toFixed(1)
            : 0;

        const icon =
            L.divIcon({

                className:'',

                html:`
                    <div class="branch-marker ${over ? 'marker-risk' : 'marker-ok'}"></div>
                `,

                iconSize:[9,9],
                iconAnchor:[4.5,4.5]
            });

        const marker =
            L.marker([lat,lng],{
                icon
            });

        marker.on('click',()=>{

            updateParameter(
                branchCode
            );
        });

        marker.bindPopup(`

            <div class="popup">

                <div class="branch">
                    ${branch}
                </div>

                <div class="status ${over ? 'status-risk' : 'status-ok'}">
                    ${over ? 'Over Limit' : 'Healthy'}
                </div>

                <div class="grid">

                    <div class="card">

                        <div class="card-label">
                            Balance
                        </div>

                        <div class="card-value">
                            ${balance.toLocaleString()}
                        </div>

                    </div>

                    <div class="card">

                        <div class="card-label">
                            Limit
                        </div>

                        <div class="card-value">
                            ${limit.toLocaleString()}
                        </div>

                    </div>

                </div>

                <div class="bar">

                    <div class="fill ${over ? 'fill-risk' : 'fill-ok'}"
                         style="width:${Math.min(util,100)}%">
                    </div>

                </div>

            </div>

        `);

        marker.addTo(layer);

        bounds.push([lat,lng]);
    });

    document.getElementById(
        'healthyCount'
    ).innerText = healthy;

    document.getElementById(
        'riskCount'
    ).innerText = risk;

    document.getElementById(
        'totalCount'
    ).innerText = healthy + risk;

    if(bounds.length){

        map.fitBounds(bounds,{
            padding:[20,20]
        });
    }
}

/* UPDATE */

async function update(){

    const data =
        await getData();

    render(data);
}

/* INIT */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        const dashboard =
            tableau.extensions
            .dashboardContent
            .dashboard;

        worksheet =
            dashboard.worksheets[0];

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType
            .SummaryDataChanged,

            update
        );

        update();
    });
};

</script>

</body>
</html>
