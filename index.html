<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>ComBank Smart Branch Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

html,
body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    background:#04152b;
}

#map{

    width:100%;
    height:100%;
}

/* =========================================================
   MAP STYLE
========================================================= */

.leaflet-container{

    background:#04152b;
}

.leaflet-control-attribution{

    display:none !important;
}

/* =========================================================
   GLASS PANEL
========================================================= */

.glass{

    background:
        rgba(5,18,38,.72);

    backdrop-filter:
        blur(18px);

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);
}

/* =========================================================
   ZOOM CONTROLS
========================================================= */

.leaflet-control-zoom{

    border:none !important;

    overflow:hidden;

    border-radius:14px !important;

    margin-top:14px !important;
    margin-left:14px !important;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.leaflet-control-zoom a{

    width:34px !important;
    height:34px !important;
    line-height:34px !important;

    border:none !important;

    background:
        rgba(255,255,255,.95) !important;

    color:#111827 !important;

    font-size:22px !important;

    transition:.2s;
}

.leaflet-control-zoom a:hover{

    background:#0ea5e9 !important;
    color:white !important;
}

/* =========================================================
   SIDE PANEL
========================================================= */

.side-panel{

    position:absolute;

    top:110px;
    left:10px;

    width:170px;

    border-radius:16px;

    z-index:9999;

    padding:16px;
}

.panel-title{

    color:white;

    font-size:14px;
    font-weight:700;

    margin-bottom:14px;
}

.legend-item{

    display:flex;
    align-items:center;

    margin-bottom:10px;
}

.legend-dot{

    width:12px;
    height:12px;

    border-radius:50%;

    margin-right:10px;
}

.dot-ok{

    background:#10d876;
}

.dot-alert{

    background:#ff4d67;
}

.legend-text{

    color:rgba(255,255,255,.88);

    font-size:12px;
}

.summary-divider{

    height:1px;

    background:
        rgba(255,255,255,.08);

    margin:16px 0;
}

.summary-row{

    display:flex;
    justify-content:space-between;

    margin-bottom:10px;
}

.summary-label{

    color:rgba(255,255,255,.7);

    font-size:12px;
}

.summary-value{

    font-size:12px;
    font-weight:700;
}

.value-ok{

    color:#10d876;
}

.value-alert{

    color:#ff4d67;
}

/* =========================================================
   MARKERS
========================================================= */

.marker{

    width:13px;
    height:13px;

    border-radius:50%;

    border:2px solid white;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:8px;
    font-weight:700;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.12);
}

.marker-ok{

    background:#10d876;
}

.marker-alert{

    background:#ff4d67;
}

/* =========================================================
   POPUP CARD
========================================================= */

.leaflet-popup-content-wrapper{

    background:
        rgba(5,18,38,.88) !important;

    backdrop-filter:
        blur(20px);

    border-radius:18px;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    padding:0;
}

.leaflet-popup-tip{

    background:
        rgba(5,18,38,.88) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:320px !important;
}

.popup-card{

    padding:18px;
}

/* HEADER */

.popup-header{

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    margin-bottom:16px;
}

.popup-title{

    color:white;

    font-size:20px;
    font-weight:700;

    line-height:1.3;
}

.popup-status{

    margin-top:8px;

    display:inline-block;

    padding:5px 10px;

    border-radius:999px;

    font-size:11px;
    font-weight:700;
}

.status-ok{

    background:
        rgba(16,216,118,.18);

    color:#10d876;
}

.status-alert{

    background:
        rgba(255,77,103,.18);

    color:#ff4d67;
}

/* GRID */

.popup-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    margin-bottom:16px;
}

.popup-box{

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.05);

    border-radius:14px;

    padding:14px;
}

.popup-label{

    color:rgba(255,255,255,.6);

    font-size:11px;

    margin-bottom:8px;

    text-transform:uppercase;

    letter-spacing:.8px;
}

.popup-currency{

    color:rgba(255,255,255,.55);

    font-size:11px;

    margin-bottom:5px;
}

.popup-value{

    color:white;

    font-size:24px;
    font-weight:700;
}

/* UTILIZATION */

.utilization-header{

    display:flex;
    justify-content:space-between;

    margin-bottom:8px;
}

.utilization-label{

    color:rgba(255,255,255,.65);

    font-size:12px;
}

.utilization-value{

    color:white;

    font-size:12px;
    font-weight:700;
}

.progress{

    width:100%;
    height:8px;

    background:
        rgba(255,255,255,.08);

    border-radius:999px;

    overflow:hidden;
}

.progress-fill{

    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #10d876,
            #00c2ff
        );
}

/* CLOSE */

.leaflet-container a.leaflet-popup-close-button{

    color:white !important;

    top:10px !important;
    right:12px !important;

    font-size:18px !important;
}

/* =========================================================
   TOP RIGHT FILTER BTN
========================================================= */

.top-btn{

    position:absolute;

    top:14px;
    right:14px;

    width:38px;
    height:38px;

    border-radius:12px;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:16px;
}

/* =========================================================
   BOTTOM RIGHT LAYER
========================================================= */

.layer-box{

    position:absolute;

    right:14px;
    bottom:14px;

    display:flex;
    gap:10px;

    z-index:9999;
}

.layer-btn{

    padding:10px 14px;

    border-radius:12px;

    color:white;

    font-size:12px;
    font-weight:600;
}

/* =========================================================
   MAP OVERLAY
========================================================= */

.map-overlay{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at top left,
            rgba(0,162,255,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(0,255,163,.12),
            transparent 30%
        );

    z-index:400;
}

</style>

</head>

<body>

<div id="map"></div>

<div class="map-overlay"></div>

<!-- =====================================================
     SIDE PANEL
===================================================== -->

<div class="side-panel glass">

    <div class="panel-title">
        Branch Status
    </div>

    <div class="legend-item">
        <div class="legend-dot dot-ok"></div>
        <div class="legend-text">Within Limit</div>
    </div>

    <div class="legend-item">
        <div class="legend-dot dot-alert"></div>
        <div class="legend-text">Over Limit</div>
    </div>

    <div class="summary-divider"></div>

    <div class="panel-title">
        Summary
    </div>

    <div class="summary-row">
        <div class="summary-label">Within Limit</div>
        <div class="summary-value value-ok" id="okCount">0</div>
    </div>

    <div class="summary-row">
        <div class="summary-label">Over Limit</div>
        <div class="summary-value value-alert" id="alertCount">0</div>
    </div>

</div>

<!-- =====================================================
     TOP BUTTON
===================================================== -->

<div class="top-btn glass">
    ▽
</div>

<!-- =====================================================
     LAYER BUTTONS
===================================================== -->

<div class="layer-box">

    <div class="layer-btn glass">
        Streets
    </div>

    <div class="layer-btn glass">
        Terrain
    </div>

</div>

<script>

/* =====================================================
   VARIABLES
===================================================== */

let worksheet;
let map;
let layer;

/* =====================================================
   INIT MAP
===================================================== */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        zoomControl:true,
        attributionControl:false,

        preferCanvas:true
    });

    /* SATELLITE STYLE */

    L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {
            maxZoom:19
        }

    ).addTo(map);

    /* LABELS */

    L.tileLayer(

        'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',

        {
            pane:'overlayPane'
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =====================================================
   MONEY FORMAT
===================================================== */

function money(v){

    return new Intl.NumberFormat(

        'en-LK',

        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }

    ).format(v);
}

/* =====================================================
   GET TABLEAU DATA
===================================================== */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(

        undefined,
        { ignoreSelection:true }

    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =====================================================
   RENDER
===================================================== */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    let okCount = 0;
    let alertCount = 0;

    const bounds = [];

    data.forEach(d => {

        const branch =
            branchField && d[branchField]
                ? d[branchField].formattedValue
                : "Unknown";

        const lat =
            latField && d[latField]
                ? Number(d[latField].nativeValue)
                : NaN;

        const lng =
            lngField && d[lngField]
                ? Number(d[lngField].nativeValue)
                : NaN;

        const balance =
            balanceField && d[balanceField]
                ? Number(d[balanceField].nativeValue)
                : 0;

        const limit =
            limitField && d[limitField]
                ? Number(d[limitField].nativeValue)
                : 0;

        if(
            isNaN(lat) ||
            isNaN(lng)
        ){
            return;
        }

        const over = balance > limit;

        if(over){
            alertCount++;
        }else{
            okCount++;
        }

        const markerClass =
            over ? 'marker-alert' : 'marker-ok';

        const statusClass =
            over ? 'status-alert' : 'status-ok';

        const statusText =
            over ? 'Over Limit' : 'Within Limit';

        const utilization =
            limit > 0
                ? ((balance / limit) * 100).toFixed(2)
                : 0;

        const icon = L.divIcon({

            className:'',

            html:`
                <div class="marker ${markerClass}">
                    ${over ? '!' : '✓'}
                </div>
            `,

            iconSize:[13,13],
            iconAnchor:[6,6]
        });

        const marker = L.marker(

            [lat,lng],

            { icon }

        ).addTo(layer);

        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-header">

                    <div>

                        <div class="popup-title">
                            ${branch}
                        </div>

                        <div class="popup-status ${statusClass}">
                            ${statusText}
                        </div>

                    </div>

                </div>

                <div class="popup-grid">

                    <div class="popup-box">

                        <div class="popup-label">
                            Total Balance
                        </div>

                        <div class="popup-currency">
                            LKR
                        </div>

                        <div class="popup-value">
                            ${balance.toLocaleString()}
                        </div>

                    </div>

                    <div class="popup-box">

                        <div class="popup-label">
                            Credit Limit
                        </div>

                        <div class="popup-currency">
                            LKR
                        </div>

                        <div class="popup-value">
                            ${limit.toLocaleString()}
                        </div>

                    </div>

                </div>

                <div class="utilization-header">

                    <div class="utilization-label">
                        Utilization
                    </div>

                    <div class="utilization-value">
                        ${utilization}%
                    </div>

                </div>

                <div class="progress">

                    <div class="progress-fill"
                        style="width:${Math.min(utilization,100)}%">
                    </div>

                </div>

            </div>

        `);

        bounds.push([lat,lng]);
    });

    document.getElementById('okCount').innerText =
        okCount;

    document.getElementById('alertCount').innerText =
        alertCount;

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[40,40]
        });
    }
}

/* =====================================================
   UPDATE
===================================================== */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =====================================================
   INIT
===================================================== */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType.SummaryDataChanged,

            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
