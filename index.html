<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ComBank Fast Branch Map</title>

<!-- TABLEAU -->
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07111f;
    font-family: Inter, Segoe UI, Arial, sans-serif;
}

#map { width: 100%; height: 100%; }

.leaflet-container { background: #07111f; }
.leaflet-control-attribution { display: none !important; }

/* ── GLASS ── */
.glass {
    background: rgba(6,18,35,.82);
    border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

/* ── LEFT PANEL ── */
.panel {
    position: absolute;
    top: 14px; left: 14px;
    width: 178px;
    border-radius: 16px;
    z-index: 9999;
    padding: 16px;
}

.panel-title { color: white; font-size: 14px; font-weight: 700; margin-bottom: 14px; }

.legend { display: flex; align-items: center; margin-bottom: 10px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
.dot-ok    { background: #10d876; }
.dot-alert { background: #ff4d67; }
.legend-text { color: rgba(255,255,255,.82); font-size: 12px; }

.divider { height: 1px; background: rgba(255,255,255,.08); margin: 14px 0; }

.summary { display: flex; justify-content: space-between; margin-bottom: 10px; }
.summary-label { color: rgba(255,255,255,.7); font-size: 12px; }
.summary-value { font-size: 12px; font-weight: 700; }
.ok-value    { color: #10d876; }
.alert-value { color: #ff4d67; }

/* ── SELECTED BRANCH BADGE ── */
.selected-badge {
    margin-top: 2px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(14,165,233,.12);
    border: 1px solid rgba(14,165,233,.25);
    display: none;
}
.selected-label {
    color: rgba(255,255,255,.45);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
}
.selected-name {
    color: #38bdf8;
    font-size: 12px;
    font-weight: 700;
    word-break: break-word;
}

/* ── TOAST ── */
#param-toast {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    background: rgba(255,77,103,.15);
    border: 1px solid rgba(255,77,103,.4);
    color: #ff4d67;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
}
#param-toast.show { opacity: 1; }

/* ── MARKERS ── */
.branch-marker {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.branch-marker:hover { transform: scale(1.5); }
.marker-ok    { background: #10d876; }
.marker-alert { background: #ff4d67; }

/* Selected marker gets a blue glow ring */
.marker-selected {
    transform: scale(1.9) !important;
    box-shadow: 0 0 0 3px rgba(56,189,248,.65), 0 0 12px rgba(56,189,248,.4);
}

/* ── POPUP ── */
.leaflet-popup-content-wrapper {
    background: rgba(8,17,32,.95) !important;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.07);
    box-shadow: 0 14px 35px rgba(0,0,0,.35);
    padding: 0;
}
.leaflet-popup-tip { background: rgba(8,17,32,.95) !important; }
.leaflet-popup-content { margin: 0 !important; width: 270px !important; }

.popup { padding: 16px; }

.popup-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px; gap: 8px;
}
.popup-title  { color: white; font-size: 16px; font-weight: 700; flex: 1; }
.popup-status {
    padding: 4px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700;
    white-space: nowrap; flex-shrink: 0;
}
.status-ok    { background: rgba(16,216,118,.18); color: #10d876; }
.status-alert { background: rgba(255,77,103,.18);  color: #ff4d67; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px 12px; }
.stat-label { color: rgba(255,255,255,.55); font-size: 10px; text-transform: uppercase; margin-bottom: 5px; }
.stat-value { color: white; font-size: 14px; font-weight: 700; }

.util-row { margin-top: 4px; }
.util-label {
    display: flex; justify-content: space-between;
    color: rgba(255,255,255,.5);
    font-size: 10px; text-transform: uppercase; margin-bottom: 5px;
}
.util-bg { height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
.util-fill { height: 100%; border-radius: 3px; }

/* Select button inside popup */
.select-btn {
    width: 100%;
    margin-top: 12px;
    padding: 9px;
    border-radius: 10px;
    border: none;
    background: rgba(14,165,233,.18);
    color: #38bdf8;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    letter-spacing: 0.3px;
}
.select-btn:hover   { background: rgba(14,165,233,.3); }
.select-btn.active  { background: rgba(16,216,118,.18); color: #10d876; cursor: default; }

/* ── ZOOM CONTROL ── */
.leaflet-control-zoom {
    border: none !important; border-radius: 14px !important;
    overflow: hidden; margin-top: 14px !important; margin-right: 14px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.24);
}
.leaflet-control-zoom a {
    background: rgba(255,255,255,.95) !important; color: #111827 !important;
    border: none !important; width: 34px !important; height: 34px !important;
    line-height: 34px !important; font-size: 20px !important;
}
.leaflet-control-zoom a:hover { background: #0ea5e9 !important; color: white !important; }

.leaflet-fade-anim .leaflet-popup { transition: none !important; }

</style>
</head>
<body>

<div id="map"></div>

<!-- SIDE PANEL -->
<div class="panel glass">
    <div class="panel-title">Branch Status</div>

    <div class="legend">
        <div class="legend-dot dot-ok"></div>
        <div class="legend-text">Within Limit</div>
    </div>
    <div class="legend">
        <div class="legend-dot dot-alert"></div>
        <div class="legend-text">Over Limit</div>
    </div>

    <div class="divider"></div>

    <div class="summary">
        <div class="summary-label">Healthy</div>
        <div class="summary-value ok-value" id="okCount">0</div>
    </div>
    <div class="summary">
        <div class="summary-label">Risk</div>
        <div class="summary-value alert-value" id="alertCount">0</div>
    </div>

    <div class="divider"></div>

    <!-- Live badge showing the currently selected branch -->
    <div class="selected-badge" id="selectedBadge">
        <div class="selected-label">Selected</div>
        <div class="selected-name" id="selectedName">—</div>
    </div>
</div>

<div id="param-toast"></div>

<script>

/* =====================================================
   CONSTANTS  ← change PARAM_NAME if your parameter
               has a different name in Tableau
===================================================== */
const PARAM_NAME = 'selBranch';

/* =====================================================
   STATE
===================================================== */
let worksheet;
let dashboard;
let map;
let layer;

let selectedBranch = null;   // branch name currently held in the parameter
let markerRegistry = {};     // { branchName: HTMLElement } for highlight

/* =====================================================
   HELPERS
===================================================== */
function money(v) {
    return new Intl.NumberFormat('en-LK', {
        style: 'currency', currency: 'LKR', maximumFractionDigits: 0
    }).format(v);
}

let toastTimer;
function showToast(msg) {
    const t = document.getElementById('param-toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
}

/* =====================================================
   SET PARAMETER
   Finds "selBranch" in the dashboard parameter list
   and changes its value to the clicked branch name.
===================================================== */
async function setParameter(branchName) {
    if (!dashboard) {
        showToast('Dashboard context unavailable — parameter not changed.');
        return;
    }

    try {
        const params = await dashboard.getParametersAsync();

        // Log all available parameters to console for debugging
        console.log('Available parameters:', params.map(p => p.name));

        const param = params.find(p => p.name === PARAM_NAME);

        if (!param) {
            showToast(`Parameter "${PARAM_NAME}" not found. Available: ${params.map(p=>p.name).join(', ')}`);
            return;
        }

        // Change the parameter value — Tableau fires any dashboard
        // actions or calcs that depend on this parameter automatically
        await param.changeValueAsync(branchName);

        console.log(`"${PARAM_NAME}" → "${branchName}"`);

        // Update UI
        selectedBranch = branchName;
        document.getElementById('selectedName').innerText  = branchName;
        document.getElementById('selectedBadge').style.display = 'block';

        // Update marker glow
        Object.entries(markerRegistry).forEach(([name, el]) => {
            el.classList.toggle('marker-selected', name === branchName);
        });

    } catch (err) {
        console.error('setParameter error:', err);
        showToast('Parameter error: ' + (err.message || String(err)));
    }
}

/* =====================================================
   BRANCH SELECTION (called from marker click AND
   the "Select Branch" button inside the popup)
===================================================== */
function handleSelectBranch(branchName) {
    setParameter(branchName);

    // Refresh button states inside any open popups
    document.querySelectorAll('.select-btn').forEach(btn => {
        const isCurrent = btn.dataset.branch === branchName;
        btn.textContent = isCurrent ? '✓ Selected' : '⊕ Select Branch';
        btn.classList.toggle('active', isCurrent);
    });
}

/* =====================================================
   MAP
===================================================== */
function initMap() {
    map = L.map('map', {
        center: [7.8731, 80.7718],
        zoom: 8,
        zoomControl: true,
        attributionControl: false,
        fadeAnimation: false,
        zoomAnimation: true,
        markerZoomAnimation: false,
        preferCanvas: false   // false so divIcon CSS transitions work
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, updateWhenIdle: true, keepBuffer: 2
    }).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =====================================================
   FETCH DATA
===================================================== */
async function getSummaryDataTable(ws) {
    let rows = [];
    const reader = await ws.getSummaryDataReaderAsync(undefined, { ignoreSelection: true });

    for (let i = 0; i < reader.pageCount; i++) {
        const page = await reader.getPageAsync(i);
        rows = rows.concat(
            page.data.map(r => {
                const row = {};
                page.columns.forEach((col, idx) => { row[col.fieldName] = r[idx]; });
                return row;
            })
        );
    }

    await reader.releaseAsync();
    return rows;
}

/* =====================================================
   FIELD DETECTION
   Handles Tableau's aggregated field names like
   "AVG(cal latit)", "SUM(Lcey Total)", etc.
===================================================== */
function findField(keys, ...needles) {
    for (const needle of needles) {
        const exact = keys.find(k => k.toLowerCase() === needle.toLowerCase());
        if (exact) return exact;
        const sub = keys.find(k => k.toLowerCase().includes(needle.toLowerCase()));
        if (sub) return sub;
    }
    return null;
}

/* =====================================================
   RENDER
===================================================== */
function render(data) {
    layer.clearLayers();
    markerRegistry = {};

    if (!data.length) return;

    const keys = Object.keys(data[0]);
    const branchField  = findField(keys, 'branch');
    const latField     = findField(keys, 'latitude',  'lat');
    const lngField     = findField(keys, 'longitude', 'lon', 'lng');
    const balanceField = findField(keys, 'balance',   'bal', 'total');
    const limitField   = findField(keys, 'limit',     'budget');

    console.log('Detected fields →', { branchField, latField, lngField, balanceField, limitField });

    let okCount = 0, alertCount = 0;
    const bounds = [];

    data.forEach(d => {
        const branch  = branchField  ? (d[branchField].formattedValue  || String(d[branchField].nativeValue))  : 'Unknown';
        const lat     = latField     ? Number(d[latField].nativeValue)     : NaN;
        const lng     = lngField     ? Number(d[lngField].nativeValue)     : NaN;
        const balance = balanceField ? Number(d[balanceField].nativeValue) : 0;
        const limit   = limitField   ? Number(d[limitField].nativeValue)   : 0;

        if (isNaN(lat) || isNaN(lng)) return;

        const over        = limit > 0 ? balance > limit : false;
        const utilPct     = limit > 0 ? (balance / limit) * 100 : 0;
        const utilDisplay = limit > 0 ? Math.round(utilPct) + '%' : 'N/A';
        const barColor    = over ? '#ff4d67' : '#10d876';
        const barWidth    = Math.min(utilPct, 100);
        const isSelected  = branch === selectedBranch;

        over ? alertCount++ : okCount++;

        // Build the marker div element directly so we keep a reference
        const markerEl = document.createElement('div');
        markerEl.className = `branch-marker ${over ? 'marker-alert' : 'marker-ok'}${isSelected ? ' marker-selected' : ''}`;

        const icon = L.divIcon({
            className: '',
            html: markerEl,
            iconSize: [12, 12], iconAnchor: [6, 6]
        });

        const marker = L.marker([lat, lng], { icon });

        // ── POPUP ──
        const escapedBranch = branch.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        marker.bindPopup(`
            <div class="popup">
                <div class="popup-header">
                    <div class="popup-title">${branch}</div>
                    <div class="popup-status ${over ? 'status-alert' : 'status-ok'}">
                        ${over ? 'Over Limit' : 'Healthy'}
                    </div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">Balance</div>
                        <div class="stat-value">${money(balance)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Limit</div>
                        <div class="stat-value">${limit > 0 ? money(limit) : '—'}</div>
                    </div>
                </div>
                ${limit > 0 ? `
                <div class="util-row">
                    <div class="util-label">
                        <span>Utilization</span>
                        <span>${utilDisplay}</span>
                    </div>
                    <div class="util-bg">
                        <div class="util-fill" style="width:${barWidth}%;background:${barColor}"></div>
                    </div>
                </div>` : ''}
                <button class="select-btn ${isSelected ? 'active' : ''}"
                        data-branch="${branch.replace(/"/g, '&quot;')}"
                        onclick="handleSelectBranch('${escapedBranch}')">
                    ${isSelected ? '✓ Selected' : '⊕ Select Branch'}
                </button>
            </div>
        `, { maxWidth: 290 });

        // ── CLICK on marker itself also selects immediately ──
        marker.on('click', () => {
            handleSelectBranch(branch);
        });

        marker.addTo(layer);
        bounds.push([lat, lng]);

        // Store reference for highlight toggling
        markerRegistry[branch] = markerEl;
    });

    document.getElementById('okCount').innerText    = okCount;
    document.getElementById('alertCount').innerText = alertCount;

    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
}

/* =====================================================
   UPDATE
===================================================== */
async function update() {
    try {
        const data = await getSummaryDataTable(worksheet);
        render(data);
    } catch (err) {
        console.error('update error:', err);
        showToast('Error: ' + (err.message || String(err)));
    }
}

/* =====================================================
   INIT
===================================================== */
window.onload = function () {
    tableau.extensions.initializeAsync()
        .then(() => {
            worksheet = tableau.extensions.worksheetContent.worksheet;

            // ── Get dashboard for parameter access ──
            // Viz extensions expose dashboardContent when placed
            // inside a dashboard (not a standalone worksheet view).
            try {
                dashboard = tableau.extensions.dashboardContent
                           ? tableau.extensions.dashboardContent.dashboard
                           : null;
                if (dashboard) {
                    console.log('Dashboard connected — parameter changes enabled.');
                } else {
                    console.warn('No dashboardContent — are you viewing this in a Dashboard (not a Sheet)?');
                }
            } catch (e) {
                dashboard = null;
                console.warn('dashboardContent unavailable:', e.message);
            }

            initMap();

            worksheet.addEventListener(
                tableau.TableauEventType.SummaryDataChanged,
                update
            );

            update();
        })
        .catch(err => {
            console.error('Init error:', err);
            showToast('Could not connect to Tableau: ' + (err.message || String(err)));
        });
};

</script>
</body>
</html>
