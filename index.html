<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ComBank Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111f;
    font-family:Arial;
}

#map{
    width:100%;
    height:100%;
}

.marker{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:14px;
    font-weight:bold;
    border:2px solid white;
    box-shadow:0 0 18px currentColor;
}

.summary{
    position:absolute;
    top:20px;
    left:20px;
    z-index:9999;
    background:rgba(0,0,0,.75);
    color:#00f2ff;
    padding:14px 20px;
    border-radius:14px;
    font-size:30px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="summary">
    <span id="count">0</span>
</div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   INIT MAP
========================= */

function initMap(){

    map = L.map('map',{
        center:[7.8731,80.7718],
        zoom:7,
        attributionControl:false
    });

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom:19
        }
    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY FORMAT
========================= */

function money(v){

    return new Intl.NumberFormat('en-LK',{
        style:'currency',
        currency:'LKR',
        maximumFractionDigits:0
    }).format(v);
}

/* =========================
   GET SUMMARY DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(
        undefined,
        { ignoreSelection:true }
    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   RENDER MAP
========================= */

function render(data){

    layer.clearLayers();

    console.log("RAW DATA:", data);

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    console.log("FIELDS:", keys);

    /* FIELD DETECTION */

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    console.log({
        branchField,
        latField,
        lngField,
        balanceField,
        limitField
    });

    /* PROCESS DATA */

    const processed = data.map(d => {

        return {

            branch:
                branchField && d[branchField]
                    ? d[branchField].formattedValue
                    : "Unknown",

            lat:
                latField && d[latField]
                    ? Number(d[latField].nativeValue)
                    : NaN,

            lng:
                lngField && d[lngField]
                    ? Number(d[lngField].nativeValue)
                    : NaN,

            balance:
                balanceField && d[balanceField]
                    ? Number(d[balanceField].nativeValue)
                    : 0,

            limit:
                limitField && d[limitField]
                    ? Number(d[limitField].nativeValue)
                    : 0
        };
    });

    console.table(processed);

    /* VALIDATE COORDINATES */

    const valid = processed.filter(d => {

        return (
            !isNaN(d.lat) &&
            !isNaN(d.lng) &&
            d.lat >= 5 &&
            d.lat <= 11 &&
            d.lng >= 79 &&
            d.lng <= 82
        );
    });

    /* UPDATE COUNT */

    document.getElementById('count').innerText = valid.length;

    const bounds = [];

    /* CREATE MARKERS */

    valid.forEach(d => {

        const over = d.balance > d.limit;

        const color = over
            ? '#ff4560'
            : '#10e39a';

        const symbol = over
            ? '!'
            : '✓';

        const icon = L.divIcon({
            className:'',
            html:`
                <div class="marker"
                     style="background:${color}">
                    ${symbol}
                </div>
            `,
            iconSize:[30,30],
            iconAnchor:[15,15]
        });

        const marker = L.marker(
            [d.lat,d.lng],
            { icon }
        ).addTo(layer);

        marker.bindPopup(`
            <div style="font-family:Arial">
                <b style="font-size:20px">
                    ${d.branch}
                </b>

                <br><br>

                Balance:
                <b>${money(d.balance)}</b>

                <br>

                Limit:
                <b>${money(d.limit)}</b>
            </div>
        `);

        bounds.push([d.lat,d.lng]);
    });

    /* AUTO ZOOM */

    if(bounds.length){

        map.fitBounds(bounds,{
            padding:[30,30]
        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =========================
   INIT EXTENSION
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(
            tableau.TableauEventType.SummaryDataChanged,
            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
