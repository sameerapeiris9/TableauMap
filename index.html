<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>ComBank Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#06111f;
    font-family:Arial;
}

#map{
    height:100%;
    width:100%;
}

.marker{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
    border:2px solid white;
    box-shadow:0 0 20px currentColor;
}

.summary{
    position:absolute;
    top:20px;
    left:20px;
    z-index:9999;
    background:rgba(0,0,0,.7);
    color:#00b4ff;
    padding:15px 20px;
    border-radius:14px;
    font-size:28px;
    font-weight:bold;
}

</style>

</head>

<body>

<div id="map"></div>

<div class="summary">
    <span id="count">0</span>
</div>

<script>

let map;
let layer;

/* MAP */

function initMap(){

    map = L.map('map',{
        center:[7.87,80.77],
        zoom:7,
        attributionControl:false
    });

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* FORMAT */

function money(v){

    return new Intl.NumberFormat(
        'en-LK',
        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }
    ).format(v);
}

/* LOAD DATA */

async function loadData(worksheet){

    const reader =
        await worksheet.getSummaryDataReaderAsync();

    const data = [];

    for(let p=0; p<reader.pageCount; p++){

        const page =
            await reader.getPageAsync(p);

        page.data.forEach(row => {

            const item = {
                branch:
                    row[0].formattedValue,

                lat:
                    Number(row[1].value),

                lng:
                    Number(row[2].value),

                balance:
                    Number(row[3].value),

                limit:
                    Number(row[4].value)
            };

            console.log(item);

            if(
                !isNaN(item.lat) &&
                !isNaN(item.lng)
            ){
                data.push(item);
            }

        });
    }

    await reader.releaseAsync();

    return data;
}

/* RENDER */

function render(data){

    layer.clearLayers();

    document.getElementById('count')
        .innerText = data.length;

    const bounds = [];

    data.forEach(d => {

        const over =
            d.balance > d.limit;

        const color =
            over
            ? '#ff4560'
            : '#00e5a0';

        const symbol =
            over
            ? '!'
            : '✓';

        const icon =
            L.divIcon({

                className:'',

                html:`
                    <div class="marker"
                    style="background:${color}">
                        ${symbol}
                    </div>
                `,

                iconSize:[28,28],
                iconAnchor:[14,14]
            });

        const marker =
            L.marker(
                [d.lat,d.lng],
                {icon}
            ).addTo(layer);

        marker.bindPopup(`
            <b>${d.branch}</b>
            <br><br>
            Balance:
            ${money(d.balance)}
            <br>
            Limit:
            ${money(d.limit)}
        `);

        bounds.push([d.lat,d.lng]);

    });

    if(bounds.length){

        map.fitBounds(bounds,{
            padding:[50,50]
        });
    }
}

/* INIT */

tableau.extensions.initializeAsync()

.then(async () => {

    initMap();

    const worksheet =
        tableau.extensions
        .worksheetContent
        .worksheet;

    async function update(){

        try{

            const data =
                await loadData(worksheet);

            render(data);

        }
        catch(err){

            console.error(err);

            alert(err.message);
        }
    }

    worksheet.addEventListener(
        tableau.TableauEventType.SummaryDataChanged,
        update
    );

    await update();

})

.catch(err => {

    console.error(err);

    alert(err.message);

});

</script>

</body>
</html>
