<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComBank Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07111f;
    font-family: Inter, Segoe UI, Arial, sans-serif;
}

#map { width: 100%; height: 100%; }

.leaflet-container { background: #07111f; }
.leaflet-control-attribution { display: none !important; }

/* ── LEGEND (top-left, compact) ── */
.legend-box {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 9999;
    background: rgba(6,18,35,.82);
    border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.leg-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.leg-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
}

.dot-ok    { background: #10d876; }
.dot-alert { background: #ff4d67; }

.leg-text {
    color: rgba(255,255,255,.75);
    font-size: 11px;
}

/* ── TOAST ── */
#toast {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
}
#toast.error   { background: rgba(255,77,103,.15); border: 1px solid rgba(255,77,103,.4); color: #ff4d67; }
#toast.success { background: rgba(16,216,118,.12); border: 1px solid rgba(16,216,118,.3); color: #10d876; }
#toast.show    { opacity: 1; }

/* ── MARKERS ── */
.branch-marker {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.branch-marker:hover { transform: scale(1.6); }
.marker-ok    { background: #10d876; }
.marker-alert { background: #ff4d67; }
.marker-selected {
    transform: scale(2) !important;
    box-shadow: 0 0 0 3px rgba(56,189,248,.7), 0 0 14px rgba(56,189,248,.45);
}

/* ── COMPACT TOOLTIP (replaces full popup) ── */
.leaflet-tooltip {
    background: rgba(8,17,32,.95) !important;
    border: 1px solid rgba(255,255,255,.08) !important;
    border-radius: 10px !important;
    box-shadow: 0 6px 20px rgba(0,0,0,.35) !important;
    padding: 0 !important;
    color: white !important;
    white-space: nowrap;
}

/* Remove the default tooltip arrow */
.leaflet-tooltip::before { display: none !important; }

.tip-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
}

.tip-name {
    font-size: 12px;
    font-weight: 700;
    color: white;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.tip-bal {
    font-size: 11px;
    color: rgba(255,255,255,.6);
    font-variant-numeric: tabular-nums;
}

.tip-status {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    flex-shrink: 0;
}
.tip-ok    { background: rgba(16,216,118,.2); color: #10d876; }
.tip-alert { background: rgba(255,77,103,.2); color: #ff4d67; }

/* ── ZOOM CONTROL ── */
.leaflet-control-zoom {
    border: none !important; border-radius: 14px !important;
    overflow: hidden; margin-top: 14px !important; margin-right: 14px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.24);
}
.leaflet-control-zoom a {
    background: rgba(255,255,255,.95) !important; color: #111827 !important;
    border: none !important; width: 34px !important; height: 34px !important;
    line-height: 34px !important; font-size: 20px !important;
}
.leaflet-control-zoom a:hover { background: #0ea5e9 !important; color: white !important; }
</style>
</head>
<body>

<div id="map"></div>

<!-- Compact legend only — no summary counts -->
<div class="legend-box">
    <div class="leg-row">
        <div class="leg-dot dot-ok"></div>
        <div class="leg-text">Within Limit</div>
    </div>
    <div class="leg-row">
        <div class="leg-dot dot-alert"></div>
        <div class="leg-text">Over Limit</div>
    </div>
</div>

<div id="toast"></div>

<script>

/* ======================================================
   CONFIG
====================================================== */
const PARAM_NAME    = 'selBranch';
const DESEL_VALUE   = 'all';        // value sent when deselecting

/* ======================================================
   STATE
====================================================== */
let worksheet;
let map;
let layer;
let selectedBranch = null;
let markerRegistry = {};   // { branchName → markerDivEl }

/* ======================================================
   TOAST
====================================================== */
let toastTimer;
function showToast(msg, type = 'error') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = `${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ======================================================
   FORMAT — balance in millions
====================================================== */
function fmtM(v) {
    const m = v / 1_000_000;
    return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + 'M';
}

/* ======================================================
   SET PARAMETER
====================================================== */
async function setParameter(value) {
    try {
        const params = await worksheet.getParametersAsync();
        const param  = params.find(p => p.name === PARAM_NAME);

        if (!param) {
            const names = params.map(p => `"${p.name}"`).join(', ');
            showToast(`Param "${PARAM_NAME}" not found. Have: ${names || 'none'}`);
            return;
        }

        await param.changeValueAsync(value);
        console.log(`✓ ${PARAM_NAME} = "${value}"`);

    } catch (err) {
        console.error('setParameter:', err);
        showToast('Param error: ' + (err.message || String(err)));
    }
}

/* ======================================================
   SELECT a branch
====================================================== */
function selectBranch(branchName) {
    selectedBranch = branchName;
    setParameter(branchName);

    // Update marker highlights
    Object.entries(markerRegistry).forEach(([name, el]) => {
        el.classList.toggle('marker-selected', name === branchName);
    });
}

/* ======================================================
   DESELECT — send "all", remove highlight
====================================================== */
function deselect() {
    if (!selectedBranch) return;   // already deselected, skip redundant call
    selectedBranch = null;
    setParameter(DESEL_VALUE);

    Object.values(markerRegistry).forEach(el => {
        el.classList.remove('marker-selected');
    });

    console.log('Deselected → parameter set to "all"');
}

/* ======================================================
   MAP INIT
====================================================== */
function initMap() {
    map = L.map('map', {
        center: [7.8731, 80.7718],
        zoom: 8,
        zoomControl: true,
        attributionControl: false,
        fadeAnimation: false,
        zoomAnimation: true,
        markerZoomAnimation: false,
        preferCanvas: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        updateWhenIdle: true,
        keepBuffer: 2
    }).addTo(map);

    layer = L.layerGroup().addTo(map);

    /* ── Click on empty map area → deselect ── */
    map.on('click', function (e) {
        // e.originalEvent.target is the element that was actually clicked.
        // If it's the map canvas/tile (not a marker), deselect.
        const target = e.originalEvent.target;
        const isMarker = target.classList.contains('branch-marker');
        if (!isMarker) {
            deselect();
        }
    });
}

/* ======================================================
   FETCH DATA
====================================================== */
async function getSummaryDataTable(ws) {
    let rows = [];
    const reader = await ws.getSummaryDataReaderAsync(
        undefined, { ignoreSelection: true }
    );
    for (let i = 0; i < reader.pageCount; i++) {
        const page = await reader.getPageAsync(i);
        rows = rows.concat(
            page.data.map(r => {
                const row = {};
                page.columns.forEach((col, idx) => { row[col.fieldName] = r[idx]; });
                return row;
            })
        );
    }
    await reader.releaseAsync();
    return rows;
}

/* ======================================================
   FIELD DETECTION
====================================================== */
function findField(keys, ...needles) {
    for (const needle of needles) {
        const exact = keys.find(k => k.toLowerCase() === needle.toLowerCase());
        if (exact) return exact;
        const sub   = keys.find(k => k.toLowerCase().includes(needle.toLowerCase()));
        if (sub)   return sub;
    }
    return null;
}

/* ======================================================
   RENDER
====================================================== */
function render(data) {
    layer.clearLayers();
    markerRegistry = {};

    if (!data.length) { showToast('No data — check Marks card.'); return; }

    const keys = Object.keys(data[0]);
    const branchField  = findField(keys, 'branchname', 'branch');
    const latField     = findField(keys, 'latitude',  'lat');
    const lngField     = findField(keys, 'longitude', 'lon', 'lng');
    const balanceField = findField(keys, 'balance',   'bal');
    const limitField   = findField(keys, 'limit',     'budget');

    console.log('Fields →', { branchField, latField, lngField, balanceField, limitField });

    const bounds = [];

    data.forEach(d => {
        const branch  = branchField  ? (d[branchField].formattedValue  || String(d[branchField].nativeValue))  : 'Unknown';
        const lat     = latField     ? Number(d[latField].nativeValue)     : NaN;
        const lng     = lngField     ? Number(d[lngField].nativeValue)     : NaN;
        const balance = balanceField ? Number(d[balanceField].nativeValue) : 0;
        const limit   = limitField   ? Number(d[limitField].nativeValue)   : 0;

        if (isNaN(lat) || isNaN(lng)) return;

        const over       = limit > 0 ? balance > limit : false;
        const isSelected = branch === selectedBranch;

        /* ── Marker dot ── */
        const markerEl = document.createElement('div');
        markerEl.className = `branch-marker ${over ? 'marker-alert' : 'marker-ok'}${isSelected ? ' marker-selected' : ''}`;

        const icon = L.divIcon({
            className: '',
            html: markerEl,
            iconSize: [12, 12], iconAnchor: [6, 6]
        });

        const marker = L.marker([lat, lng], { icon });

        /* ── Compact tooltip (sticky on click, hover on mouseover) ──
           Shows: Branch Name  |  X.XXM  |  Within/Over Limit pill       */
        const tipHtml = `
            <div class="tip-inner">
                <div>
                    <div class="tip-name">${branch}</div>
                    <div class="tip-bal">LKR ${fmtM(balance)}</div>
                </div>
                <div class="tip-status ${over ? 'tip-alert' : 'tip-ok'}">
                    ${over ? 'Over Limit' : 'Within Limit'}
                </div>
            </div>`;

        marker.bindTooltip(tipHtml, {
            direction:  'top',
            offset:     [0, -8],
            opacity:    1,
            permanent:  false,   // shows on hover; click makes it sticky below
            className:  ''
        });

        /* ── Click: select branch + open sticky tooltip ── */
        marker.on('click', function (e) {
            L.DomEvent.stopPropagation(e);   // prevent map click from firing deselect
            selectBranch(branch);

            // Open the tooltip and keep it visible
            marker.openTooltip();
        });

        marker.addTo(layer);
        bounds.push([lat, lng]);
        markerRegistry[branch] = markerEl;
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
}

/* ======================================================
   UPDATE
====================================================== */
async function update() {
    try {
        const data = await getSummaryDataTable(worksheet);
        render(data);
    } catch (err) {
        console.error('update error:', err);
        showToast('Error: ' + (err.message || String(err)));
    }
}

/* ======================================================
   INIT
====================================================== */
window.onload = function () {
    tableau.extensions.initializeAsync()
        .then(() => {
            worksheet = tableau.extensions.worksheetContent.worksheet;
            console.log('Extension on worksheet:', worksheet.name);

            initMap();

            worksheet.addEventListener(
                tableau.TableauEventType.SummaryDataChanged,
                update
            );

            update();
        })
        .catch(err => {
            console.error('Init error:', err);
            showToast('Init failed: ' + (err.message || String(err)));
        });
};

</script>
</body>
</html>
