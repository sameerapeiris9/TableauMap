<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>ComBank Premium Smart Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

html,body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Inter,
        Segoe UI,
        sans-serif;

    background:#031326;
}

#map{

    width:100%;
    height:100%;
}

/* =========================
   MAP STYLE
========================= */

.leaflet-container{

    background:#031326;
}

.leaflet-control-attribution{

    display:none !important;
}

/* =========================
   GLASS ZOOM CONTROLS
========================= */

.leaflet-control-zoom{

    border:none !important;

    margin-top:16px !important;
    margin-left:16px !important;

    border-radius:14px !important;

    overflow:hidden;

    backdrop-filter:blur(10px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.leaflet-control-zoom a{

    width:38px !important;
    height:38px !important;
    line-height:38px !important;

    background:
        rgba(255,255,255,.92) !important;

    color:#0f172a !important;

    border:none !important;

    font-size:22px !important;

    transition:.2s;
}

.leaflet-control-zoom a:hover{

    background:#00b894 !important;
    color:white !important;
}

/* =========================
   LEFT PANEL
========================= */

.side-panel{

    position:absolute;

    top:110px;
    left:14px;

    width:170px;

    z-index:9999;

    background:
        rgba(3,19,38,.82);

    backdrop-filter:blur(16px);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:18px;

    padding:16px;

    color:white;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);
}

.panel-title{

    font-size:15px;
    font-weight:700;

    margin-bottom:14px;
}

.legend-item{

    display:flex;
    align-items:center;

    margin-bottom:12px;

    font-size:12px;
}

.legend-dot{

    width:12px;
    height:12px;

    border-radius:50%;

    margin-right:10px;
}

.green{

    background:#19c37d;
}

.red{

    background:#ff4d6d;
}

.summary-title{

    margin-top:18px;
    margin-bottom:14px;

    font-size:14px;
    font-weight:700;
}

.summary-row{

    display:flex;
    justify-content:space-between;

    margin-bottom:12px;

    font-size:12px;
}

.summary-value-green{

    color:#19c37d;
    font-weight:700;
}

.summary-value-red{

    color:#ff4d6d;
    font-weight:700;
}

/* =========================
   MARKERS
========================= */

.marker{

    width:12px;
    height:12px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.95);

    box-shadow:
        0 2px 10px rgba(0,0,0,.28);
}

.marker-ok{

    background:#19c37d;
}

.marker-alert{

    background:#ff4d6d;
}

/* =========================
   POPUP CARD
========================= */

.leaflet-popup-content-wrapper{

    background:
        rgba(3,19,38,.96) !important;

    backdrop-filter:blur(18px);

    border-radius:22px;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    padding:0;
}

.leaflet-popup-tip{

    background:
        rgba(3,19,38,.96) !important;
}

.leaflet-popup-content{

    margin:0 !important;

    width:310px !important;
}

.popup-card{

    padding:20px;
}

/* HEADER */

.popup-header{

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    margin-bottom:18px;
}

.popup-title{

    font-size:18px;
    font-weight:700;

    color:white;
}

.popup-sub{

    margin-top:6px;

    display:inline-block;

    font-size:11px;
    font-weight:700;

    padding:5px 10px;

    border-radius:999px;
}

.sub-ok{

    background:
        rgba(25,195,125,.18);

    color:#19c37d;
}

.sub-alert{

    background:
        rgba(255,77,109,.18);

    color:#ff4d6d;
}

/* GRID */

.popup-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    margin-bottom:18px;
}

.popup-box{

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.05);

    border-radius:16px;

    padding:14px;
}

.popup-label{

    color:#7dd3fc;

    font-size:11px;

    margin-bottom:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.popup-value{

    font-size:20px;
    font-weight:700;

    color:white;
}

/* PROGRESS */

.progress-wrap{

    margin-top:8px;
}

.progress-top{

    display:flex;
    justify-content:space-between;

    margin-bottom:8px;

    font-size:11px;

    color:#cbd5e1;
}

.progress{

    width:100%;
    height:10px;

    background:
        rgba(255,255,255,.08);

    border-radius:999px;

    overflow:hidden;
}

.progress-bar{

    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #19c37d,
            #00e5ff
        );
}

/* CLOSE BUTTON */

.leaflet-container a.leaflet-popup-close-button{

    color:white !important;

    top:14px !important;
    right:14px !important;

    font-size:18px !important;
}

/* =========================
   OVERLAY GLOW
========================= */

.overlay{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at top left,
            rgba(0,229,255,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(25,195,125,.10),
            transparent 30%
        );

    z-index:400;
}

</style>

</head>

<body>

<div id="map"></div>

<div class="overlay"></div>

<!-- SIDE PANEL -->

<div class="side-panel">

    <div class="panel-title">
        Branch Status
    </div>

    <div class="legend-item">
        <div class="legend-dot green"></div>
        Within Limit
    </div>

    <div class="legend-item">
        <div class="legend-dot red"></div>
        Over Limit
    </div>

    <div class="summary-title">
        Summary
    </div>

    <div class="summary-row">
        <span>Within Limit</span>
        <span class="summary-value-green" id="okCount">
            0
        </span>
    </div>

    <div class="summary-row">
        <span>Over Limit</span>
        <span class="summary-value-red" id="alertCount">
            0
        </span>
    </div>

</div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   MAP
========================= */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,

        attributionControl:false,
        preferCanvas:true
    });

    /* SATELLITE STYLE */

    L.tileLayer(

        'https://server.arcgisonline.com/ArcGIS/rest/services/' +
        'World_Imagery/MapServer/tile/{z}/{y}/{x}',

        {
            maxZoom:19
        }

    ).addTo(map);

    /* LABELS */

    L.tileLayer(

        'https://services.arcgisonline.com/ArcGIS/rest/services/' +
        'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',

        {
            pane:'shadowPane'
        }

    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY
========================= */

function money(v){

    return new Intl.NumberFormat(

        'en-LK',

        {
            style:'currency',
            currency:'LKR',
            maximumFractionDigits:0
        }

    ).format(v);
}

/* =========================
   DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(

        undefined,
        { ignoreSelection:true }

    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   RENDER
========================= */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    let okCount = 0;
    let alertCount = 0;

    const bounds = [];

    data.forEach(d => {

        const lat =
            latField && d[latField]
                ? Number(d[latField].nativeValue)
                : NaN;

        const lng =
            lngField && d[lngField]
                ? Number(d[lngField].nativeValue)
                : NaN;

        if(
            isNaN(lat) ||
            isNaN(lng)
        ){
            return;
        }

        const branch =
            branchField && d[branchField]
                ? d[branchField].formattedValue
                : "Unknown";

        const balance =
            balanceField && d[balanceField]
                ? Number(d[balanceField].nativeValue)
                : 0;

        const limit =
            limitField && d[limitField]
                ? Number(d[limitField].nativeValue)
                : 0;

        const over =
            balance > limit;

        if(over){
            alertCount++;
        }else{
            okCount++;
        }

        const percent = limit > 0
            ? ((balance / limit) * 100).toFixed(1)
            : 0;

        const markerClass =
            over ? 'marker-alert' : 'marker-ok';

        const statusClass =
            over ? 'sub-alert' : 'sub-ok';

        const statusText =
            over ? 'Over Limit' : 'Within Limit';

        const icon = L.divIcon({

            className:'',

            html:`
                <div class="marker ${markerClass}">
                </div>
            `,

            iconSize:[12,12],
            iconAnchor:[6,6]
        });

        const marker = L.marker(
            [lat,lng],
            { icon }
        ).addTo(layer);

        marker.bindPopup(`

            <div class="popup-card">

                <div class="popup-header">

                    <div>

                        <div class="popup-title">
                            ${branch}
                        </div>

                        <div class="popup-sub ${statusClass}">
                            ${statusText}
                        </div>

                    </div>

                </div>

                <div class="popup-grid">

                    <div class="popup-box">

                        <div class="popup-label">
                            Total Balance
                        </div>

                        <div class="popup-value">
                            ${money(balance)}
                        </div>

                    </div>

                    <div class="popup-box">

                        <div class="popup-label">
                            Credit Limit
                        </div>

                        <div class="popup-value">
                            ${money(limit)}
                        </div>

                    </div>

                </div>

                <div class="progress-wrap">

                    <div class="progress-top">

                        <span>
                            Utilization
                        </span>

                        <span>
                            ${percent}%
                        </span>

                    </div>

                    <div class="progress">

                        <div
                            class="progress-bar"
                            style="width:${Math.min(percent,100)}%">
                        </div>

                    </div>

                </div>

            </div>

        `);

        bounds.push([lat,lng]);
    });

    document.getElementById("okCount")
        .innerText = okCount;

    document.getElementById("alertCount")
        .innerText = alertCount;

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[40,40]
        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =========================
   INIT
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(

            tableau.TableauEventType.SummaryDataChanged,

            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Error:",
            error
        );
    });
};

</script>

</body>
</html>
