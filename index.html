<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ComBank Smart Branch Map</title>

<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
    font-family:Inter,Segoe UI,Arial;
}

#map{
    width:100%;
    height:100%;
    background:#050816;
}

/* REMOVE LEAFLET DEFAULT WHITE BG */

.leaflet-container{
    background:#050816;
}

/* HIDE ATTRIBUTION */

.leaflet-control-attribution{
    display:none;
}

/* MODERN GLOW MARKER */

.marker-wrap{
    position:relative;
    width:18px;
    height:18px;
}

.marker-pulse{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    animation:pulse 2.2s infinite;
    opacity:.55;
}

.marker-core{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.9);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:10px;
    font-weight:700;
    backdrop-filter:blur(4px);
    box-shadow:
        0 0 12px rgba(255,255,255,.4),
        0 0 24px currentColor;
}

/* SUCCESS */

.ok .marker-core{
    background:#00d68f;
    color:white;
}

.ok .marker-pulse{
    background:#00d68f;
}

/* ALERT */

.alert .marker-core{
    background:#ff4d6d;
    color:white;
}

.alert .marker-pulse{
    background:#ff4d6d;
}

/* GLASS POPUP */

.leaflet-popup-content-wrapper{
    background:rgba(10,14,30,.92);
    color:white;
    border-radius:18px;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 10px 40px rgba(0,0,0,.5);
}

.leaflet-popup-tip{
    background:rgba(10,14,30,.92);
}

.leaflet-popup-content{
    margin:18px 20px;
    min-width:180px;
}

.popup-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
    color:white;
}

.popup-row{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:14px;
}

.popup-label{
    opacity:.7;
}

.popup-value{
    font-weight:700;
}

/* ANIMATION */

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:.55;
    }

    70%{
        transform:scale(2.8);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:0;
    }
}

/* SMOOTH MAP */

.leaflet-fade-anim .leaflet-popup{
    transition:opacity .2s linear;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

let worksheet;
let map;
let layer;

/* =========================
   MAP INIT
========================= */

function initMap(){

    map = L.map('map',{

        center:[7.8731,80.7718],
        zoom:8,
        zoomControl:true,
        attributionControl:false,
        preferCanvas:true

    });

    /* DARK MODERN MAP */

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom:19
        }
    ).addTo(map);

    layer = L.layerGroup().addTo(map);
}

/* =========================
   MONEY FORMAT
========================= */

function money(v){

    return new Intl.NumberFormat('en-LK',{

        style:'currency',
        currency:'LKR',
        maximumFractionDigits:0

    }).format(v);
}

/* =========================
   GET SUMMARY DATA
========================= */

async function getSummaryDataTable(ws){

    let rows = [];

    const reader = await ws.getSummaryDataReaderAsync(
        undefined,
        { ignoreSelection:true }
    );

    for(let i=0; i<reader.pageCount; i++){

        const page = await reader.getPageAsync(i);

        rows = rows.concat(

            page.data.map(r => {

                const row = {};

                page.columns.forEach((col,idx)=>{

                    row[col.fieldName] = r[idx];

                });

                return row;
            })
        );
    }

    await reader.releaseAsync();

    return rows;
}

/* =========================
   RENDER MAP
========================= */

function render(data){

    layer.clearLayers();

    if(!data.length){
        return;
    }

    const sample = data[0];

    const keys = Object.keys(sample);

    /* FIELD DETECTION */

    const branchField = keys.find(k =>
        k.toLowerCase() === 'branch'
    );

    const latField = keys.find(k =>
        k.toLowerCase() === 'latitude'
    );

    const lngField = keys.find(k =>
        k.toLowerCase() === 'longitude'
    );

    const balanceField = keys.find(k =>
        k.toLowerCase().includes('balance')
    );

    const limitField = keys.find(k =>
        k.toLowerCase().includes('limit')
    );

    /* PROCESS */

    const processed = data.map(d => {

        return {

            branch:
                branchField && d[branchField]
                    ? d[branchField].formattedValue
                    : "Unknown",

            lat:
                latField && d[latField]
                    ? Number(d[latField].nativeValue)
                    : NaN,

            lng:
                lngField && d[lngField]
                    ? Number(d[lngField].nativeValue)
                    : NaN,

            balance:
                balanceField && d[balanceField]
                    ? Number(d[balanceField].nativeValue)
                    : 0,

            limit:
                limitField && d[limitField]
                    ? Number(d[limitField].nativeValue)
                    : 0
        };
    });

    /* VALID COORDS */

    const valid = processed.filter(d => {

        return (
            !isNaN(d.lat) &&
            !isNaN(d.lng) &&
            d.lat >= 5 &&
            d.lat <= 11 &&
            d.lng >= 79 &&
            d.lng <= 82
        );
    });

    const bounds = [];

    /* DRAW */

    valid.forEach(d => {

        const over = d.balance > d.limit;

        const statusClass = over
            ? 'alert'
            : 'ok';

        const symbol = over
            ? '!'
            : '✓';

        const icon = L.divIcon({

            className:'',

            html:`

                <div class="marker-wrap ${statusClass}">

                    <div class="marker-pulse"></div>

                    <div class="marker-core">
                        ${symbol}
                    </div>

                </div>

            `,

            iconSize:[18,18],
            iconAnchor:[9,9]

        });

        const marker = L.marker(
            [d.lat,d.lng],
            { icon }
        ).addTo(layer);

        marker.bindPopup(`

            <div class="popup-title">
                ${d.branch}
            </div>

            <div class="popup-row">
                <div class="popup-label">
                    Balance
                </div>

                <div class="popup-value">
                    ${money(d.balance)}
                </div>
            </div>

            <div class="popup-row">
                <div class="popup-label">
                    Limit
                </div>

                <div class="popup-value">
                    ${money(d.limit)}
                </div>
            </div>

        `);

        bounds.push([d.lat,d.lng]);
    });

    /* AUTO FIT */

    if(bounds.length){

        map.fitBounds(bounds,{

            padding:[40,40]

        });
    }
}

/* =========================
   UPDATE
========================= */

async function update(){

    const data =
        await getSummaryDataTable(worksheet);

    render(data);
}

/* =========================
   INIT EXTENSION
========================= */

window.onload = function(){

    tableau.extensions.initializeAsync()

    .then(() => {

        worksheet =
            tableau.extensions
            .worksheetContent
            .worksheet;

        initMap();

        worksheet.addEventListener(
            tableau.TableauEventType.SummaryDataChanged,
            update
        );

        update();
    })

    .catch(error => {

        console.error(
            "Extension Initialization Error:",
            error
        );
    });
};

</script>

</body>
</html>
